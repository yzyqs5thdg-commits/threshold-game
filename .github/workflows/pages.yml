# Publishes the no-server preview build (dist/index.html) to GitHub Pages.
# The preview records nothing; it exists so the instrument can be reviewed and played.
name: Deploy preview to GitHub Pages

on:
  push:
    branches: [claude/build-threshold-game, master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-standalone.js
      - run: mkdir -p site && cp dist/index.html site/index.html && touch site/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
