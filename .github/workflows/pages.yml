# Rebuilds the no-server preview (dist/index.html) and publishes it to the gh-pages branch,
# which GitHub Pages serves at https://yzyqs5thdg-commits.github.io/threshold-game/
# The preview records nothing; it exists so the instrument can be reviewed and played.
name: Publish preview to GitHub Pages

on:
  push:
    branches: [claude/build-threshold-game, master, main]
    paths: [server/**, public/**, scripts/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: node scripts/build-standalone.js
      - name: Push to gh-pages
        run: |
          mkdir -p site && cp dist/index.html site/index.html && touch site/.nojekyll
          cd site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish preview from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
