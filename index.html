.fx-effects-incoming--inline .fx-effects-incoming-rule,
.fx-effects-incoming--inline .fx-effects-incoming-tail { display: none; }
.fx-effects-incoming--inline .fx-effects-incoming-sweep { width: 45%; }
@media (max-width: 560px) {
  .fx-effects-incoming--inline { font-size: 0.56rem; letter-spacing: 0.1em; padding: 0 9px 0 6px; gap: 6px; }
  .fx-effects-incoming--inline .fx-effects-incoming-part-3,
  .fx-effects-incoming--inline .fx-effects-incoming-sep-2 { display: none; }
}

/* =========================================================================================
   scanSweep(el): one-off scanline band top → bottom inside an overlay
   ========================================================================================= */
.fx-effects-scan {
  position: absolute;
  inset: 0;
  z-index: 6;
  border-radius: inherit;
  overflow: hidden;
  pointer-events: none;
}
.fx-effects-scan::before {
  /* faint scanline wash that fades out with the band */
  content: "";
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(180deg, rgba(127, 179, 255, 0.05) 0 1px, transparent 1px 3px);
  animation: fxeffects-scan-wash 520ms ease-out both;
}
@keyframes fxeffects-scan-wash {
  from { opacity: 1; }
  to { opacity: 0; }
}
.fx-effects-scan-band {
  position: absolute;
  left: 0;
  right: 0;
  top: -24%;
  height: 24%;
  transform: translateY(0);
  background: linear-gradient(180deg,
    rgba(233, 185, 76, 0) 0%,
    rgba(233, 185, 76, 0.05) 45%,
    rgba(233, 185, 76, 0.16) 85%,
    rgba(243, 207, 122, 0.6) 97%,
    rgba(255, 255, 255, 0.9) 100%);
  box-shadow: 0 1px 0 rgba(255, 255, 255, 0.4), 0 2px 18px rgba(233, 185, 76, 0.55);
  animation: fxeffects-scan 520ms cubic-bezier(0.3, 0.5, 0.45, 1) both;
}
@keyframes fxeffects-scan {
  from { transform: translateY(0); opacity: 1; }
  80% { opacity: 1; }
  to { transform: translateY(540%); opacity: 0; }
}

/* =========================================================================================
   decodeReveal(el): the text itself is driven by JS; this adds a faint signal tint while decoding
   ========================================================================================= */
.fx-effects-decoding {
  text-shadow: 0 0 10px rgba(127, 179, 255, 0.35);
  transition: text-shadow 400ms ease;
  /* JS pins min/max-height to the final height for the duration; the wider scrambled glyphs may
     need one more line than the real text, and that line is clipped rather than pushing the layout */
  overflow: hidden;
}

/* =========================================================================================
   badgeActivate(el)
   ========================================================================================= */
.fx-effects-badge {
  position: absolute;
  inset: 0;
  z-index: 4;
  border-radius: inherit;
  overflow: hidden;
  pointer-events: none;
}
.fx-effects-badge-ring {
  position: absolute;
  inset: 0;
  border-radius: inherit;
  border: 1.5px solid rgba(243, 207, 122, 0.95);
  box-shadow: 0 0 22px rgba(233, 185, 76, 0.55), inset 0 0 22px rgba(233, 185, 76, 0.25);
  opacity: 0;
  transform: scale(0.84);
  animation: fxeffects-badge-ring 800ms cubic-bezier(0.25, 0.5, 0.35, 1) both;
}
.fx-effects-badge-ring-2 { animation-delay: 160ms; border-color: rgba(127, 179, 255, 0.8); box-shadow: 0 0 18px rgba(127, 179, 255, 0.4); }
@keyframes fxeffects-badge-ring {
  0% { opacity: 0; transform: scale(0.84); }
  22% { opacity: 1; }
  70% { opacity: 0.5; }
  100% { opacity: 0; transform: scale(1); }
}
.fx-effects-badge-sweep {
  position: absolute;
  top: -30%;
  bottom: -30%;
  left: 0;
  width: 45%;
  transform: translateX(-130%) skewX(-20deg);
  background: linear-gradient(90deg, rgba(243, 207, 122, 0) 0%, rgba(243, 207, 122, 0.2) 42%, rgba(243, 207, 122, 0.85) 50%, rgba(243, 207, 122, 0.2) 58%, rgba(243, 207, 122, 0) 100%);
  mix-blend-mode: screen;
  animation: fxeffects-badge-sweep 640ms cubic-bezier(0.45, 0, 0.3, 1) 60ms both;
}
@keyframes fxeffects-badge-sweep {
  from { transform: translateX(-130%) skewX(-20deg); }
  to { transform: translateX(330%) skewX(-20deg); }
}
.fx-effects-badge-corner {
  position: absolute;

const C = { x: 380, y: 100 };

const EDGES = [
  [0, 1, 'a'], [0, 2, 'a'], [0, 3, 'a'], [0, 4, 'a'],
  [1, 5, 's'], [1, 7, 's'], [2, 9, 's'], [2, 5, 's'],

// Packets: [edgeIndex, reverse, variant 1..6]  (variant picks a duration/delay pair in CSS)
const PACKETS = [
  [0, false, 1], [1, true, 2], [2, false, 3], [3, true, 4],
  [4, false, 5], [6, true, 6], [8, false, 2], [9, true, 3],

];

// Nodes that emit a slow pulse ring (variant for stagger).
const PULSES = [[1, 1], [4, 2], [6, 3], [9, 4], [10, 5], [5, 6]];

function hexPoints(cx, cy, r) {
  const pts = [];
  for (let i = 0; i < 6; i++) {

const fx_geo = (() => {
/* THRESHOLD fx: "geo" vignette.
   A holographic wireframe globe for the top of the Geopolitical incident card.
   Pure decorative string; carries no information about the incident or the experimental condition.
   All ids are prefixed "fxgeo-", all classes "fx-geo-". Styles live in /fx/geo.css.

   Rendering: 760x200 viewBox, preserveAspectRatio slice. On narrow banners (~360x160) the visible
   window is roughly x 155..605, so the globe, markers, orbit and reticle sit inside that band; the
   wings (x<150, x>610) only hold secondary dressing that is fine to crop.

   Geometry: orthographic globe seen from a 22 degree elevation. Latitude rings are static ellipses
   (rotation about the polar axis leaves them in place). Meridians are unit circles under an animated
   scale(R sin lambda, R cos beta) . skewY(delta) transform (two SMIL animateTransforms), which is the
   exact projection of a great circle through the poles at longitude lambda; skewY keeps the unit
   circle's (0,+-1) on the poles, so the two half-circles split there without a rotate. Each has a
   bright front half and a dim back half (CSS stroke-opacity keyframes, see geo.css) so the spin reads
   as a sphere turning rather than ellipses breathing. The three location markers are HUD "locks" on the
   front face: identical glyphs, identical ring motion, only their phase differs.

   Performance rules (see docs/BUILD_DECISIONS.md): no SVG filter on anything that moves. Glows on
   moving parts are wider low-opacity strokes or radialGradient fills; feGaussianBlur is used only on
   the static marker glyphs. SMIL is kept to what cannot be CSS (the meridian spin, the satellite
   motion path); every fade is a CSS keyframe on an opacity property alone (opacity, or stroke-opacity
   for the meridian halves: geo.css explains why). */

const R = 78;                       // globe radius (viewBox units)
const C = { x: 380, y: 100 };       // globe centre
const TILT = -14;                   // screen tilt of the polar axis (degrees)
const BETA = (22 * Math.PI) / 180;  // viewer elevation above the equatorial plane
const CB = Math.cos(BETA);
const SB = Math.sin(BETA);
const HALF_TURN = 18;               // seconds for a meridian to travel 180 degrees (full spin = 36s)
const MERIDIANS = 6;

const f2 = (n) => (Math.abs(n) < 0.005 ? '0' : n.toFixed(2));

/* ---- projection helpers ------------------------------------------------------------------- */

// Point on the sphere at latitude `lat`, longitude `lon` (degrees, lon measured from the viewer),
// projected to globe-local screen coordinates (y down). Returns [x, y, depth] where depth > 0 = front.
function project(lat, lon) {
  const th = (lat * Math.PI) / 180;
  const la = (lon * Math.PI) / 180;
  const x = R * Math.cos(th) * Math.sin(la);
  const y = R * (SB * Math.cos(la) * Math.cos(th) - CB * Math.sin(th));
  const depth = Math.cos(th) * Math.cos(la) * CB + Math.sin(th) * SB;
  return [x, y, depth];
}

// Meridian transform for longitude lambda (radians): unit circle -> skewX(alpha) scale(a, Rv) [rotate(delta) for halves]
function meridianFrame(lam) {
  const delta = Math.atan((SB * Math.cos(lam)) / CB);
  const Rv = R * Math.sqrt(CB * CB + SB * SB * Math.cos(lam) ** 2);
  const a = R * Math.sin(lam) * Math.cos(delta);
  const c = R * Math.sin(lam) * Math.sin(delta);
  const alpha = (Math.atan(c / Rv) * 180) / Math.PI;
  return { alpha, a, Rv, delta: (delta * 180) / Math.PI };
}

const SAMPLES = 36;
const FRAMES = Array.from({ length: SAMPLES + 1 }, (_, k) => meridianFrame((Math.PI * k) / SAMPLES));
// scale(R sin lambda, R cos beta) . skewY(delta): the y scale is constant, only x breathes.
const SCALE_VALUES = FRAMES.map((_, k) => `${f2(R * Math.sin((Math.PI * k) / SAMPLES))},${f2(R * CB)}`).join(';');
const SKEWY_VALUES = FRAMES.map((f) => f2(f.delta)).join(';');
// Right half-ellipse faces the viewer for lambda in (0,90), the left half for (90,180); the cross-fade
// at the limb is the CSS keyframes fxgeo-mhalf-r / fxgeo-mhalf-l (same 18s period, delays per meridian).

/* ---- fixed subject geometry ---------------------------------------------------------------- */

// Three identical HUD-locked markers on the front face. Nothing distinguishes them but phase.
const MARKERS = [
  project(30, -40),
  project(6, 38),
  project(-28, -4),
];

// Great-circle-ish arcs: quadratic Beziers whose control point lifts off the surface.
function arcPath(p, q) {
  const mx = (p[0] + q[0]) / 2;
  const my = (p[1] + q[1]) / 2;
  const d = Math.hypot(mx, my) || 1;
  const lift = R * 1.62;
  const cx = (mx / d) * lift;
  const cy = (my / d) * lift;
  return `M${f2(p[0])},${f2(p[1])} Q${f2(cx)},${f2(cy)} ${f2(q[0])},${f2(q[1])}`;
}

  arcPath(MARKERS[0], MARKERS[1]),
  arcPath(MARKERS[1], MARKERS[2]),

];

// Stars of the same variant share one twinkle (duration + phase), so they live in one group and the
// group is what animates: five animated elements instead of one per star.
function stars() {

  let s = 1337;
  const rnd = () => { s = (s * 16807) % 2147483647; return s / 2147483647; };
  for (let i = 0; i < 44; i++) {
    const x = 8 + rnd() * 744;
    const y = 8 + rnd() * 184;
    // keep the disc clear so stars read as background
    if (Math.hypot(x - C.x, y - C.y) < R + 8) continue;
    const r = 0.5 + rnd() * 0.9;
    groups[i % 5].push(`<circle cx="${f2(x)}" cy="${f2(y)}" r="${f2(r)}"/>`);
  }
  return groups.map((g, v) => `<g class="fx-geo-star fx-geo-star--v${v + 1}" fill="#e8edf8">${g.join('')}</g>`).join('');
}

// decodeReveal state: element -> { original, saved, lockHeight, token }. Keeping the original text
// and the saved inline height values here means a second call during a running decode still knows
// the true text and the true pre-decode styles instead of a half-scrambled snapshot.
const DECODING = new WeakMap();
// No wide glyphs (W, M, m, w, %, &, #) so the scrambled line is seldom longer than the real one.
const GLYPHS = 'ABCDEFGHJKLNPRSTUVXYZabcdefghkinopqrstuvxyz0123456789<>/|=+*';
const LOCK_PROPS = ['min-height', 'max-height'];

/** Small deterministic hash → [0,1), used for per-character resolve jitter. */
function unitHash(i) {
  let x = (i + 1) * 2654435761;
  x = (x ^ (x >>> 15)) * 2246822519;
  x = (x ^ (x >>> 13)) * 3266489917;
  return ((x ^ (x >>> 16)) >>> 0) / 4294967296;
}

/**
 * Scramble-to-text decode: random glyphs resolve into the element's real characters, left to
 * right, finishing at exactly `duration` ms regardless of text length. Whitespace is never
 * scrambled, Unicode is handled per code point, and the exact original textContent is restored at
 * the end. Safe to call again while a decode is running on the same element.
 * @param {HTMLElement} el   Element whose textContent is the final text.
 * @param {{ duration?: number }} [opts]
 * @returns {Promise<void>}
 */
function decodeReveal(el, { duration = 900 } = {}) {
  if (!isElement(el)) return Promise.resolve();
  let original;
  let saved;
  let lockHeight;
  try {
    const prev = DECODING.get(el);
    if (prev) {
      // A decode already owns this element: its inline styles are ours, so carry the values it
      // saved forward rather than re-reading our own lock as if it were the caller's.
      original = prev.original;
      saved = prev.saved;
      lockHeight = prev.lockHeight;
    } else {
      original = el.textContent;
      saved = LOCK_PROPS.map((prop) => [prop, el.style.getPropertyValue(prop), el.style.getPropertyPriority(prop)]);
      lockHeight = undefined;
    }
  } catch {
    return Promise.resolve();
  }
  if (typeof original !== 'string') return Promise.resolve();

  const state = { original, saved, lockHeight, token: Symbol('decode') };
  DECODING.set(el, state);
  const owns = () => DECODING.get(el) === state;

  const restore = () => {
    if (!owns()) return;
    try {
      el.textContent = original;
      el.classList.remove(PREFIX + 'decoding');
      for (const [prop, value, priority] of state.saved) {
        if (value) el.style.setProperty(prop, value, priority);
        else el.style.removeProperty(prop);
      }
      // Leave no residue: an emptied style attribute is dropped entirely.
      if (el.style.length === 0 && el.getAttribute('style') !== null) el.removeAttribute('style');
    } catch { /* ignore */ }
    DECODING.delete(el);
  };

  const ms = Number(duration);
  const chars = Array.from(original);
  const n = chars.length;
  if (reducedMotion() || !(ms > 0) || n === 0 || typeof requestAnimationFrame !== 'function') {
    restore();
    return Promise.resolve();
  }

  // Per-character resolve time as a fraction of the duration: a left→right wave with jitter.
  const thresholds = new Array(n);
  for (let i = 0; i < n; i++) {
    const base = n > 1 ? i / (n - 1) : 0;
    thresholds[i] = Math.min(0.97, 0.05 + base * 0.78 + unitHash(i) * 0.14);
  }

  // Pin the element to its final height for the duration (min- and max-height; the decoding class
  // adds overflow: hidden) so the wider scrambled glyphs never reflow what sits below it.
  try {
    if (state.lockHeight === undefined) {
      const rect = el.getBoundingClientRect();
      let h = rect.height;
      const cs = getComputedStyle(el);
      if (cs.boxSizing !== 'border-box') {
        for (const side of ['Top', 'Bottom']) {
          h -= parseFloat(cs[`padding${side}`]) || 0;
          h -= parseFloat(cs[`border${side}Width`]) || 0;
        }
      }
      state.lockHeight = h > 0 ? h : null;
    }
    if (state.lockHeight) {
      for (const prop of LOCK_PROPS) el.style.setProperty(prop, `${state.lockHeight}px`);
    }
    el.classList.add(PREFIX + 'decoding');
  } catch { /* ignore */ }

  const start = performance.now();
  let lastScramble = -Infinity;
  let scrambled = new Array(n);
  let seed = 0x9e3779b9;
  const rnd = () => {
    seed ^= seed << 13; seed >>>= 0;
    seed ^= seed >>> 17;
    seed ^= seed << 5; seed >>>= 0;
    return seed / 4294967296;
  };

  const frame = () => {
    if (!owns()) return;
    const now = performance.now();
    const p = Math.min(1, (now - start) / ms);
    if (p >= 1) return; // the timer below performs the final restore
    if (now - lastScramble >= 55) {
      // Refresh unresolved glyphs at ~18 Hz — a readable decode, not a strobe.
      lastScramble = now;
      for (let i = 0; i < n; i++) scrambled[i] = GLYPHS[(rnd() * GLYPHS.length) | 0];
    }
    const out = new Array(n);
    for (let i = 0; i < n; i++) {
      const c = chars[i];
      out[i] = p >= thresholds[i] || /\s/.test(c) ? c : scrambled[i];
    }
    try { el.textContent = out.join(''); } catch { /* ignore */ }
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);

  return new Promise((resolve) => {
    setTimeout(() => { restore(); resolve(); }, ms);
    // If superseded by a later decode, resolve this one too so callers never hang.
    const poll = () => {
      if (!owns()) { resolve(); return; }
      if (performance.now() - start < ms) setTimeout(poll, 100);
    };
    setTimeout(poll, 100);
  });
}

async function api(path, { method = 'GET', body } = {}) {
  if (hooks.api) return hooks.api(path, { method, body });

  const res = await fetch(path, {

// is sent as text/plain so the browser makes a "simple" cross-origin request (no preflight, which
// Apps Script cannot answer). Errors come back inside the JSON with an HTTP-style status.
async function gasApi(path, method, body) {
  if (path === '/api/config') return window.__THRESHOLD_CONFIG__;
  let action;
  let payload = {};
  const m = path.match(/^\/api\/sessions\/([^/]+)\/(submit|withdraw)$/);
  if (path === '/api/sessions' && method === 'POST') {
    action = 'session';
    payload = body || {};
  } else if (m && method === 'POST') {
    action = m[2];
    payload = { sessionId: m[1], ...(body || {}) };
  } else {
    const err = new Error('Unsupported request');
    err.status = 404;
    throw err;
  }
  const res = await fetch(BACKEND.url, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action, ...payload }),
    credentials: 'omit',
    cache: 'no-store',
    redirect: 'follow',
  });
  let data = null;
  try {
    data = await res.json();
  } catch {
    /* non-JSON */
  }
  if (!res.ok || !data || data.error) {
    const err = new Error(data?.error || `Request failed (${res.status})`);
    err.status = data?.status || res.status || 500;
    err.details = data?.details;
    throw err;
  }
  return data;
}

function render(html, { step, focus = true, sweep = true } = {}) {
  if (vignetteCleanup) {
    try { vignetteCleanup(); } catch { /* ignore */ }
    vignetteCleanup = null;
  }
  app.innerHTML = html;
  if (typeof step === 'number') setProgress(step);
  const panel = app.querySelector('.panel');
  if (panel && sweep) fx(scanSweep, panel);
  window.scrollTo(0, 0);
  if (focus) {
    const h = app.querySelector('h1, h2');
    if (h) {
      h.setAttribute('tabindex', '-1');
      h.focus({ preventScroll: true });
    }
  }
  hooks.afterRender?.(state.screen, app, state);
}

function go(screen, patch = {}) {
  Object.assign(state, patch, { screen });
  saveState();
  show();
}

function showError(container, message) {
  let box = container.querySelector('.alert--error');
  if (!box) {
    box = document.createElement('div');
    box.className = 'alert alert--error';
    box.setAttribute('role', 'alert');
    container.prepend(box);
  }
  box.textContent = message;
}

// ---------------------------------------------------------------------------
// Item sequence: scenarios 1–2, data-quality item, scenarios 3–4
// ---------------------------------------------------------------------------
function itemSequence() {
  const m = state.materials;
  const [s1, s2, s3, s4] = m.scenarios;
  return [
    { kind: 'scenario', data: s1 },
    { kind: 'scenario', data: s2 },
    { kind: 'attention', data: m.attentionCheck },
    { kind: 'scenario', data: s3 },
    { kind: 'scenario', data: s4 },
  ];
}

// ---------------------------------------------------------------------------
// Screens
// ---------------------------------------------------------------------------
function show() {
  switch (state.screen) {
    case 'consent': return renderConsent();
    case 'declined': return renderDeclined();
    case 'profile': return renderProfile();
    case 'style': return renderStyle();
    case 'briefing': return renderBriefing();
    case 'item': return renderItem();
    case 'manipulation': return renderManipulation();
    case 'closing': return renderClosing();
    case 'submitted': return renderSubmitted();
    case 'withdrawn': return renderWithdrawn();
    default:
      state = freshState();
      saveState();
      return renderConsent();
  }
}

function renderItem() {
  const seq = itemSequence();
  const idx = state.itemIndex;
  if (idx >= seq.length) return go('manipulation');
  const { kind, data } = seq[idx];
  const m = state.materials;

  const code = `INC-${String(idx + 1).padStart(2, '0')}`;
  const vignette = VIGNETTES[data.domain];
  let banner = '';
  try { banner = vignette?.render?.() || ''; } catch { banner = ''; }
  let incoming = '';
  try {
    incoming = (renderIncomingBanner({ code, domain: data.domain }) || '').replace(/class="fx-effects-incoming(["\s])/, 'class="fx-effects-incoming fx-effects-incoming--inline$1');
  } catch { incoming = ''; }
  // Timed screen: no entrance fade and no scan sweep, so the situation report is fully readable at first paint.
  render(`
    <div class="panel incident" data-item="${idx + 1}">
      <div class="incident__band" aria-hidden="true">${banner}</div>
      <div class="incident__top">
        <div class="eyebrow">
          <div class="eyebrow__left">${incoming}</div>
          <span class="counter">${idx + 1} of ${seq.length}</span>
        </div>
        <div class="incident__head">
          <div class="incident__icon" aria-hidden="true">${iconFor(data.domain)}</div>
          <div class="incident__title">
            <span class="incident__domain">${esc(data.domain)}</span>
            <h1>${esc(data.title)}</h1>
          </div>
        </div>
      </div>
      <div class="sitrep">
        <div class="sitrep__label">Situation report</div>
        <p>${esc(data.context)}</p>
        <p>${esc(data.framing)}</p>
      </div>
      <div class="decision">
        <div class="decision__label"><h2 id="decision-label">Your call</h2><span class="counter">Risk exposure</span></div>
        <div class="options" role="group" aria-labelledby="decision-label">
          ${m.decisionOptions.map((o) => `<button type="button" class="option" data-value="${esc(o.value)}" aria-pressed="false"><span class="option__glyph">${OPTION_GLYPHS[o.value] || ''}</span><span class="option__label">${esc(o.label)}</span></button>`).join('')}
        </div>
      </div>
      <form id="confidence" class="confidence" hidden novalidate>
        <fieldset class="field" data-field="confidence">
          <legend>${esc(m.confidence.question)}</legend>
          <div class="likert">${[1, 2, 3, 4, 5].map((n) => `
            <label><input type="radio" name="confidence" value="${n}"><span class="n">${n}</span><span class="t">${n === 1 ? esc(m.confidence.anchors.low) : n === 5 ? esc(m.confidence.anchors.high) : ''}</span></label>`).join('')}</div>
        </fieldset>
        <div class="actions actions--end">
          <button type="submit" class="btn">Log decision</button>
        </div>
      </form>
    </div>`, { step: 4 + idx, sweep: false });

  // Optional JS-driven animation inside the vignette (cleaned up on the next render).
  const svg = app.querySelector('.incident__vignette svg');
  if (svg && typeof vignette?.mount === 'function') {
    try { vignetteCleanup = vignette.mount(svg) || null; } catch { vignetteCleanup = null; }
  }

  // Latency clock starts when the scenario is painted: provisional value now, replaced by the
  // timestamp of the first frame after this render (double requestAnimationFrame).
  itemShownAt = performance.now();
  const shownToken = Symbol('shown');
  itemShownToken = shownToken;
  requestAnimationFrame(() => requestAnimationFrame(() => {
    if (itemShownToken === shownToken) itemShownAt = performance.now();
  }));
  itemHidden = document.visibilityState === 'hidden';
  firstChoiceAt = null;
  lastChoiceAt = null;
  document.removeEventListener('visibilitychange', onVisibility);
  document.addEventListener('visibilitychange', onVisibility);

  let choice = null;
  const options = [...app.querySelectorAll('.option')];
  const confidenceForm = document.getElementById('confidence');

  const eventTime = (e) => (e && typeof e.timeStamp === 'number' && e.timeStamp > 0 && e.timeStamp < 1e12 ? e.timeStamp : performance.now());
  let logged = false;
  for (const btn of options) {
    btn.addEventListener('click', (e) => {
      if (logged) return;
      const t = eventTime(e);
      if (firstChoiceAt === null) firstChoiceAt = t;
      lastChoiceAt = t;
      choice = btn.dataset.value;
      for (const b of options) b.setAttribute('aria-pressed', String(b === btn));
      if (confidenceForm.hidden) {
        confidenceForm.hidden = false;
        confidenceForm.querySelector('legend').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    });
  }

  confidenceForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const conf = Number(confidenceForm.querySelector('input[name="confidence"]:checked')?.value);
    const ok = Number.isInteger(conf) && conf >= 1 && conf <= 5 && choice;
    confidenceForm.querySelector('[data-field="confidence"]').classList.toggle('field--invalid', !ok);
    if (!ok) return showError(confidenceForm, 'Please rate your confidence to continue.');

    const latency = (lastChoiceAt - itemShownAt) / 1000;
    const latencyFirst = (firstChoiceAt - itemShownAt) / 1000;
    document.removeEventListener('visibilitychange', onVisibility);

    if (logged) return;
    logged = true;
    const logBtn = confidenceForm.querySelector('button[type="submit"]');
    logBtn.disabled = true;
    for (const b of options) b.disabled = true;
    for (const r of confidenceForm.querySelectorAll('input')) r.disabled = true;
    const advance = () => {
      if (kind === 'scenario') {
        const decisions = state.decisions.filter((d) => d.scenarioId !== data.id);
        decisions.push({ scenarioId: data.id, choice, confidence: conf, latency, latencyFirst, hidden: itemHidden });
        go('item', { decisions, itemIndex: idx + 1 });
      } else {
        // Data-quality item: response recorded, confidence not analysed, not scored.
        go('item', { attention: { choice, latency, confidence: conf }, itemIndex: idx + 1 });
      }
    };
    fx(lockIn, logBtn).then(advance);
  });
}

    } catch (err) {
      if (err.status === 409) return go('submitted'); // already recorded (e.g. double click after a slow network)
      busy(false);
      submitBtn.textContent = c.submitLabel;
      showError(actions.parentElement, err.status === 400
        ? 'Your responses could not be submitted because some answers were missing. Please contact the study team at CU_ERM_Research@columbia.edu.'
        : err.status === 429
          ? 'The study server is busy right now. Please wait a moment and press Submit again. Your responses are still on this page.'
          : 'We could not reach the server. Please check your connection and try again. Your responses are still on this page.');
    }
  });

  withdrawBtn.addEventListener('click', () => {
    confirmBox.hidden = false;
    document.getElementById('withdraw-yes').focus();
  });
  document.getElementById('withdraw-no').addEventListener('click', () => {
    confirmBox.hidden = true;
    withdrawBtn.focus();
  });
  document.getElementById('withdraw-yes').addEventListener('click', async () => {
    busy(true);
    try {
      await api(`/api/sessions/${state.sessionId}/withdraw`, { method: 'POST', body: {} });
    } catch {
      /* Even if the server is unreachable, nothing has been submitted: the responses are discarded locally. */
    }
    go('withdrawn');
  });
}

function buildPayload() {
  return {
    clientConsentAt: state.clientConsentAt,
    clientMcAt: state.clientMcAt,
    profile: state.profile,
    style: state.style,
    decisions: [...state.decisions].sort((a, b) => a.scenarioId - b.scenarioId),
    attention: state.attention ? { choice: state.attention.choice, latency: state.attention.latency } : null,
    manipulation: state.manipulation,
    client: { instrument: config.versions.instrument, consent: config.versions.consent },
  };
}

function renderSubmitted() {
  const c = state.materials?.closing;
  clearState();
  render(`
    <div class="panel">
      <div class="stamp">Session complete</div>
      <h1>Thank you</h1>
      <p class="lead">Your responses have been submitted. You may now close this window.</p>
      ${config.followupFormUrl
        ? `<hr class="divider">
           <p>${esc(c?.followupPrompt ?? '')}</p>
           <div class="actions"><a class="btn" href="${esc(config.followupFormUrl)}" target="_blank" rel="noopener noreferrer">Leave my email (separate form)</a></div>`
        : ''}
    </div>`, { step: 11 });
  fx(stampIn, app.querySelector('.stamp'));
}

function renderWithdrawn() {
  clearState();
  render(`
    <div class="panel">
      <div class="stamp">Session closed</div>
      <h1>Thank you</h1>
      <p class="lead">Your responses have been withdrawn and deleted. You may now close this window.</p>
    </div>`, { step: 11 });
  fx(stampIn, app.querySelector('.stamp'));
}

// ---------------------------------------------------------------------------
// Boot
// ---------------------------------------------------------------------------
function mountDesk() {
  const canvas = document.getElementById('ambient');
  if (canvas) fx(mountAmbient, canvas);
  const extras = document.getElementById('hud-extras');
  if (extras) {
    try { extras.innerHTML = renderHudExtras() || ''; } catch { extras.innerHTML = ''; }
  }
}

/** One-time "system boot" splash shown over the sign-in screen (purely decorative, skippable). */
function bootSplash() {
  let seen = false;
  try { seen = sessionStorage.getItem(BOOT_KEY) === '1'; } catch { /* ignore */ }
  if (seen || REDUCED_MOTION) return Promise.resolve();
  try { sessionStorage.setItem(BOOT_KEY, '1'); } catch { /* ignore */ }
  return new Promise((resolve) => {
    const el = document.createElement('div');
    el.className = 'boot';
    el.setAttribute('aria-hidden', 'true');
    el.innerHTML = `
      <div class="boot__inner">
        <span class="mark mark--lg"></span>
        <div class="boot__title">THRESHOLD</div>
        <div class="boot__sub">Meridian Group · Risk operations desk</div>
        <div class="boot__line"><i></i></div>
        <div class="boot__log"><span>initialising secure desk</span><span>loading day-one schedule</span><span>link established</span></div>
      </div>`;
    document.body.appendChild(el);
    let done = false;
    const finish = () => {
      if (done) return;
      done = true;
      el.classList.add('boot--out');
      setTimeout(() => { el.remove(); resolve(); }, 420);
    };
    el.addEventListener('click', finish);
    const onKey = () => { document.removeEventListener('keydown', onKey); finish(); };
    document.addEventListener('keydown', onKey);
    setTimeout(finish, 1700);
  });
}

(async function boot() {
  mountDesk();
  try {
    config = window.__THRESHOLD_CONFIG__ || (await api('/api/config'));
  } catch {
    render(`<div class="panel"><h1>Unable to load</h1><p>The study page could not be loaded. Please refresh or try again later.</p></div>`, { step: 0 });
    return;
  }
  if (config.studyClosed && state.screen === 'consent') return renderClosed();
  // A resumed session must still have its materials; otherwise start over.
  if (state.screen !== 'consent' && (!state.sessionId || !state.materials)) {
    state = freshState();
    saveState();
  }
  if (state.screen === 'consent') {
    const splash = bootSplash();
    show();
    await splash;
  } else {
    show();
  }
})();

</script>
