<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="referrer" content="no-referrer">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2212%22%20fill%3D%22%2315264a%22%2F%3E%3Cpath%20d%3D%22M16%2020h32v7H36v20h-8V27H16z%22%20fill%3D%22%23a9c4ff%22%2F%3E%3C%2Fsvg%3E%0A">
<title>THRESHOLD — Decision-Making in Organizational Risk Scenarios</title>
<style>
/* THRESHOLD — "CRO operations desk" visual system.
   One committed dark theme so every participant sees the same environment.
   Rules that protect the experiment: the three decision options share identical styling,
   nothing on screen reacts to the content of a decision, and the data-quality item uses
   exactly the incident template. */

:root {
  /* Layout: a fixed HUD rail on the left (timeline + clock) and a stage on the right where each screen is a panel. */
  --ground: #0a1020;
  --ground-2: #0e1628;
  --panel: #131d33;
  --panel-2: #182440;
  --paper: #f5f1e8;        /* the consent document, as a sheet of paper on the desk */
  --paper-ink: #1b2233;
  --line: #233150;
  --line-2: #2f4169;
  --ink: #e8edf8;
  --ink-2: #aab6d0;
  --ink-3: #8593b1;
  --amber: #e9b94c;        /* HUD readouts, current state, selection */
  --amber-2: #f3cf7a;
  --amber-ink: #1c1504;
  --signal: #7fb3ff;       /* focus rings, links */
  --danger: #ff8f8f;
  --radius: 14px;
  --font: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  font-family: var(--font);
  font-size: 17px;
  line-height: 1.55;
  color: var(--ink);
  background:
    radial-gradient(1200px 600px at 80% -10%, rgba(233, 185, 76, 0.08), transparent 60%),
    radial-gradient(900px 500px at -10% 110%, rgba(127, 179, 255, 0.07), transparent 60%),
    var(--ground);
  min-height: 100vh;
}
body::before {
  /* faint grid, like a control-room backdrop */
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background-image: linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
  background-size: 40px 40px;
  mask-image: radial-gradient(ellipse at center, #000 30%, transparent 85%);
}

.skip { position: absolute; left: -999px; top: 0; background: var(--amber); color: var(--amber-ink); padding: 8px 12px; z-index: 10; }
.skip:focus { left: 8px; top: 8px; }

/* ---------- desk layout ---------- */
.desk { position: relative; z-index: 1; display: grid; grid-template-columns: 260px minmax(0, 1fr); min-height: 100vh; }
.stage { min-width: 0; }
.hud {
  position: sticky; top: 0; align-self: start; height: 100vh;
  display: flex; flex-direction: column; gap: 22px;
  padding: 26px 22px; border-right: 1px solid var(--line);
  overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--line-2) transparent;
  background: linear-gradient(180deg, rgba(19, 29, 51, 0.9), rgba(10, 16, 32, 0.9));
}
.hud__brand { display: flex; align-items: center; gap: 12px; }
.mark { width: 30px; height: 30px; border-radius: 8px; flex: none;
  background: conic-gradient(from 210deg, var(--amber), #b7842a, var(--amber-2), var(--amber));
  box-shadow: 0 0 0 1px rgba(255,255,255,0.08), 0 6px 18px rgba(233,185,76,0.25); }
.hud__org { font-weight: 700; font-size: 0.95rem; letter-spacing: 0.01em; }
.hud__app { font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.28em; color: var(--amber); }
.hud__readout { display: flex; flex-direction: column; gap: 2px; padding: 10px 14px; border: 1px solid var(--line); border-radius: 10px; background: rgba(0,0,0,0.25); }
.hud__label { font-size: 0.7rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3); white-space: nowrap; }
.hud__time { font-family: var(--mono); font-size: 1.5rem; line-height: 1.1; color: var(--amber); font-variant-numeric: tabular-nums; }
.hud__foot { margin-top: auto; font-size: 0.72rem; color: var(--ink-3); line-height: 1.5; }
.hud__foot a { color: var(--ink-2); }
.hud__mail { word-break: break-all; }

/* day timeline */
.timeline { list-style: none; margin: 0; padding: 0 0 0 6px; display: flex; flex-direction: column; gap: 0; }
.timeline li { position: relative; display: flex; align-items: center; gap: 12px; padding: 7px 0 7px 18px; font-size: 0.88rem; color: var(--ink-3); }
.timeline li::before { content: ""; position: absolute; left: 0; top: 50%; width: 10px; height: 10px; border-radius: 50%; transform: translateY(-50%);
  background: var(--ground-2); border: 2px solid var(--line-2); }
.timeline li::after { content: ""; position: absolute; left: 4px; top: calc(50% + 7px); width: 2px; height: calc(100% - 14px); background: var(--line); }
.timeline li:last-child::after { display: none; }
.timeline li.done { color: var(--ink-2); }
.timeline li.done::before { background: var(--line-2); border-color: var(--line-2); }
.timeline li.current { color: var(--ink); font-weight: 600; }
.timeline li.current::before { background: var(--amber); border-color: var(--amber); box-shadow: 0 0 0 4px rgba(233,185,76,0.18), 0 0 14px rgba(233,185,76,0.6); }
.timeline .sub { font-family: var(--mono); font-size: 0.68rem; color: var(--ink-3); letter-spacing: 0.08em; margin-left: auto; }
.timeline li.current .sub { color: var(--amber); }

.stage { padding: 34px 40px 60px; max-width: 920px; width: 100%; outline: none; }

@media (max-height: 880px) { .hud__extras { display: none; } }
@media (max-height: 700px) { .hud { position: static; height: auto; } }

@media (max-width: 860px) {
  .desk { grid-template-columns: minmax(0, 1fr); }
  .hud { position: static; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 10px 16px; border-right: 0; border-bottom: 1px solid var(--line); overflow: visible; }
  .mark { width: 24px; height: 24px; border-radius: 6px; }
  .hud__org { font-size: 0.88rem; line-height: 1.1; }
  .hud__app { font-size: 0.62rem; }
  .hud__readout { flex-direction: row; align-items: baseline; padding: 8px 12px; gap: 12px; }
  .hud__time { font-size: 1.05rem; }
  .hud__foot { display: none; }
  .timeline { flex-direction: row; flex-wrap: wrap; width: 100%; gap: 4px 14px; padding: 0; }
  .timeline { gap: 6px 10px; align-items: center; }
  .timeline li { padding: 2px 0 2px 18px; font-size: 0.78rem; }
  .timeline li:not(.current) { font-size: 0; width: 18px; padding: 0 0 0 18px; height: 16px; }
  .timeline li::after { display: none; }
  .timeline .sub { display: none; }
  .stage { padding: 12px 12px 48px; }
  body { font-size: 16px; }
}

/* ---------- panels ---------- */
.panel {
  background: linear-gradient(180deg, var(--panel-2), var(--panel));
  border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: 0 20px 60px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.04);
  padding: 30px 32px 28px;
  animation: rise 360ms cubic-bezier(.2,.7,.2,1);
}
.panel + .panel { margin-top: 18px; }
.panel--center { text-align: center; }
@media (max-width: 560px) { .panel { padding: 22px 18px 20px; } }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .panel, .confidence, .option, .badge__row { animation: none !important; transition: none !important; } }

/* ---------- type ---------- */
h1, h2, h3 { line-height: 1.2; margin: 0 0 10px; color: var(--ink); text-wrap: balance; }
h1 { font-size: 1.75rem; font-weight: 750; letter-spacing: -0.01em; }
h2 { font-size: 1.2rem; font-weight: 700; }
h3 { font-size: 1rem; font-weight: 700; margin-top: 18px; }
h1[tabindex="-1"]:focus, h2[tabindex="-1"]:focus { outline: none; }
p { margin: 0 0 12px; }
.muted { color: var(--ink-2); }
.small { font-size: 0.9rem; }
.lead { font-size: 1.08rem; }
.kicker { font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--amber); margin: 0 0 10px; }
.eyebrow { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.tag { display: inline-flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-2); border: 1px solid var(--line-2); padding: 5px 10px; border-radius: 6px; background: rgba(0,0,0,0.2); }
.tag svg { width: 14px; height: 14px; }
.counter { font-family: var(--mono); font-size: 0.78rem; color: var(--ink-3); letter-spacing: 0.1em; }
a { color: var(--signal); }

/* ---------- consent (paper on the desk) ---------- */
.paper { background: var(--paper); color: var(--paper-ink); border-radius: 10px; padding: 22px 24px; border: 1px solid #d9d2c2; box-shadow: 0 12px 30px rgba(0,0,0,0.35); font-family: Georgia, "Times New Roman", serif; }
.paper h2 { color: var(--paper-ink); font-family: var(--font); }
.paper h3 { color: var(--paper-ink); font-family: var(--font); font-size: 0.95rem; margin-top: 14px; }
.paper h3:first-child { margin-top: 0; }
.paper p { font-size: 0.95rem; }
.paper a { color: #2b4a8a; }
.paper, .consent-doc { overflow-wrap: anywhere; }
.consent-doc { max-height: 44vh; overflow-y: auto; border: 1px solid #d9d2c2; border-radius: 8px; padding: 16px 18px; background: #fbf9f4; margin: 14px 0 16px; }
.statement { font-size: 0.93rem; border-left: 3px solid var(--amber); padding: 8px 14px; margin-bottom: 16px; background: #f1ebdd; }
.paper .field label { color: var(--paper-ink); font-family: var(--font); }
.paper .field input[type="text"], .paper .field input[type="date"] { background: #fff; color: var(--paper-ink); border-color: #c9c1ad; }
.paper .alert--error { background: #fbe9e9; color: #8a2b2b; border-color: #ecc; }

/* ---------- forms ---------- */
.field { margin-bottom: 16px; }
.field label, .field .label { display: block; font-weight: 600; margin-bottom: 6px; }
.field select, .field input[type="text"], .field input[type="date"] {
  width: 100%; font: inherit; padding: 11px 12px; border: 1px solid var(--line-2); border-radius: 10px; background: rgba(0,0,0,0.25); color: var(--ink);
}
.field select option { background: var(--panel); color: var(--ink); }
.field select:focus, .field input:focus { outline: 3px solid var(--signal); outline-offset: 1px; }
.field--invalid select, .field--invalid input, .field--invalid .likert, .field--invalid .choices { border-color: var(--danger); box-shadow: 0 0 0 2px rgba(255,143,143,0.2); }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 18px; }
@media (max-width: 560px) { .grid-2 { grid-template-columns: 1fr; } }
fieldset { border: 0; padding: 0; margin: 0 0 18px; min-width: 0; }
legend { font-weight: 600; padding: 0; margin-bottom: 8px; }

/* onboarding: form + live badge */
.onboard { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 26px; align-items: start; }
@media (max-width: 1040px) { .onboard { grid-template-columns: 1fr; } .badge { order: -1; max-width: 360px; position: static; } }
.badge { position: sticky; top: 24px; border-radius: 16px; padding: 18px 18px 16px; color: var(--ink);
  background: linear-gradient(160deg, #1b2a4b, #0f1a31); border: 1px solid var(--line-2);
  box-shadow: 0 16px 40px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.06); overflow: hidden; }
.badge::before { content: ""; position: absolute; inset: 0; background: radial-gradient(400px 160px at 100% 0%, rgba(233,185,76,0.14), transparent 60%); pointer-events: none; }
.badge__top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.badge__org { font-family: var(--mono); font-size: 0.66rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--amber); }
.badge__chip { width: 34px; height: 24px; border-radius: 5px; background: linear-gradient(135deg, #e9d28a, #b08a2e); opacity: 0.9; }
.badge__role { font-size: 1.15rem; font-weight: 750; line-height: 1.15; margin-bottom: 2px; }
.badge__sub { font-size: 0.8rem; color: var(--ink-3); margin-bottom: 14px; }
.badge__row { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-top: 1px solid rgba(255,255,255,0.07); font-size: 0.82rem; }
.badge__row span:first-child { color: var(--ink-3); flex: 1 1 auto; min-width: 0; }
.badge__row span:last-child { text-align: right; color: var(--ink); font-weight: 600; flex: 0 1 auto; white-space: nowrap; }
.badge__row.empty span:last-child { color: var(--ink-3); font-weight: 400; }
.badge__bars { display: flex; gap: 6px; margin-top: 14px; }
.badge__bars i { flex: 1; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.1); }
.badge__bars i.on { background: var(--amber); box-shadow: 0 0 8px rgba(233,185,76,0.6); }

/* Likert 1–5 (style items + confidence) */
.likert { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; border: 1px solid transparent; border-radius: 10px; }
.likert label { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 11px 4px; border: 1px solid var(--line-2); border-radius: 10px; background: rgba(0,0,0,0.22); cursor: pointer; text-align: center; font-size: 0.9rem; user-select: none; transition: background 120ms ease, border-color 120ms ease, transform 120ms ease; }
.likert label:hover { border-color: var(--ink-3); transform: translateY(-1px); }
.likert label span.n { font-weight: 700; font-size: 1.05rem; font-family: var(--mono); }
.likert label span.t { font-size: 0.7rem; color: var(--ink-3); line-height: 1.2; }
.likert input { position: absolute; opacity: 0; inset: 0; margin: 0; }
.likert label:has(input:focus-visible) { outline: 3px solid var(--signal); outline-offset: 1px; }
.likert label:has(input:checked) { background: var(--amber); border-color: var(--amber-2); color: var(--amber-ink); box-shadow: 0 0 18px rgba(233,185,76,0.35); }
.likert label:has(input:checked) span.t { color: #4a3a0a; }
@media (max-width: 420px) { .likert label span.t { display: none; } }

/* vertical radio choices (debrief questions) */
.choices { display: flex; flex-direction: column; gap: 8px; border: 1px solid transparent; border-radius: 10px; }
.choices label { position: relative; display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border: 1px solid var(--line-2); border-radius: 10px; background: rgba(0,0,0,0.22); cursor: pointer; }
.choices input { margin-top: 4px; flex: none; accent-color: var(--amber); }
.choices label:has(input:checked) { border-color: var(--amber); background: rgba(233,185,76,0.1); }
.choices label:has(input:focus-visible) { outline: 3px solid var(--signal); outline-offset: 1px; }

/* ---------- character (Dr. Vale) ---------- */
.comms { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 22px; align-items: start; }
@media (max-width: 560px) { .comms { grid-template-columns: 96px minmax(0, 1fr); gap: 14px; } .portrait { max-width: 96px; } }
.portrait { position: relative; border-radius: 14px; overflow: hidden; aspect-ratio: 3 / 4; max-width: 100%; border: 1px solid var(--line-2); background: #0b1324; box-shadow: 0 12px 30px rgba(0,0,0,0.4); }
.portrait svg { width: 100%; height: 100%; display: block; }
.portrait__live { position: absolute; left: 8px; top: 8px; font-family: var(--mono); font-size: 0.62rem; letter-spacing: 0.16em; color: var(--amber-ink); background: var(--amber); padding: 3px 7px; border-radius: 4px; }
.comms__meta { font-size: 0.86rem; color: var(--ink-3); margin-bottom: 10px; }
.comms__name { font-weight: 700; color: var(--ink); }
.speech { position: relative; background: rgba(0,0,0,0.25); border: 1px solid var(--line-2); border-radius: 14px; padding: 18px 20px; font-size: 1.08rem; line-height: 1.6; }
.speech::before { content: ""; position: absolute; left: -9px; top: 22px; width: 16px; height: 16px; background: inherit; border-left: 1px solid var(--line-2); border-bottom: 1px solid var(--line-2); transform: rotate(45deg); background: #121c33; }
@media (max-width: 560px) { .speech::before { display: none; } }
.speech p:last-child { margin-bottom: 0; }

/* ---------- incident (scenario) ---------- */
.incident { position: relative; overflow: hidden; animation: none; container-type: inline-size; }
.incident::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--amber); opacity: 0.85; z-index: 2; }
/* the animated scene sits behind the header as a backdrop band */
.incident__band { position: absolute; left: 0; right: 0; top: 0; height: 190px; overflow: hidden; background: #0b1324; }
.incident__band::after { content: ""; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(180deg, rgba(19,29,51,0.15) 0%, rgba(19,29,51,0.35) 45%, rgba(19,29,51,0.92) 82%, var(--panel) 100%); }
.incident__band svg { width: 100%; height: 100%; display: block; }
.incident__top { position: relative; z-index: 1; min-height: 160px; display: flex; flex-direction: column; justify-content: space-between; gap: 18px; }
.incident .eyebrow { margin-bottom: 0; }
.eyebrow__left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-width: 0; }
.incident__head { display: flex; align-items: center; gap: 14px; min-width: 0; }
.incident__head h1 { margin: 0; min-width: 0; overflow-wrap: anywhere; text-shadow: 0 2px 14px rgba(10,16,32,0.9); }
.incident__title { min-width: 0; }
.incident__domain { display: block; font-family: var(--mono); font-size: 0.7rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--amber); margin-bottom: 4px; text-shadow: 0 1px 8px rgba(10,16,32,0.9); }
.incident__icon { flex: none; width: 48px; height: 48px; border-radius: 12px; display: grid; place-items: center; background: rgba(10,16,32,0.6); border: 1px solid rgba(233,185,76,0.45); color: var(--amber); backdrop-filter: blur(2px); }
.incident__icon svg { width: 26px; height: 26px; }
.sitrep { position: relative; z-index: 1; margin-top: 18px; padding: 18px 20px; border-radius: 12px; background: rgba(0,0,0,0.25); border: 1px solid var(--line); }
.sitrep p { font-size: 1.06rem; }
.sitrep p:last-child { margin-bottom: 0; }
.sitrep__label { font-family: var(--mono); font-size: 0.68rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 8px; }
.decision { margin-top: 20px; }
.decision__label { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
.options { display: grid; gap: 10px; }
.option {
  display: flex; align-items: center; gap: 14px; width: 100%; text-align: left;
  font: inherit; font-size: 1.02rem; font-weight: 650; color: var(--ink);
  padding: 15px 16px; border: 1.5px solid var(--line-2); border-radius: 12px; background: rgba(0,0,0,0.22); cursor: pointer;
  transition: background 120ms ease, border-color 120ms ease, transform 120ms ease;
}
.option:hover { border-color: var(--ink-3); transform: translateY(-1px); }
.option:focus-visible { outline: 3px solid var(--signal); outline-offset: 2px; }
.option:disabled { cursor: default; transform: none; }
.option__glyph { flex: none; width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; border: 1px solid var(--line-2); background: rgba(255,255,255,0.03); color: var(--ink-2); }
.option__glyph svg { width: 18px; height: 18px; }
.option__label { min-width: 0; }
.option[aria-pressed="true"] { background: var(--amber); border-color: var(--amber-2); color: var(--amber-ink); box-shadow: 0 0 22px rgba(233,185,76,0.35); }
.option[aria-pressed="true"] .option__glyph { color: var(--amber-ink); border-color: rgba(0,0,0,0.25); background: rgba(0,0,0,0.08); }
/* wide cards: the three options sit in one row so the whole call fits on a laptop screen without scrolling */
@container (min-width: 640px) {
  .options { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .option { flex-direction: column; align-items: flex-start; gap: 12px; padding: 14px 16px 16px; }
}
.confidence { margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--line); animation: rise 240ms ease; }
.confidence[hidden] { display: none; }
@media (max-width: 560px) {
  .incident__band { height: 118px; }
  .incident__top { min-height: 96px; gap: 10px; }
  .incident__head { gap: 10px; }
  .incident__head h1 { font-size: 1.35rem; }
  .incident__icon { width: 38px; height: 38px; }
  .incident__icon svg { width: 20px; height: 20px; }
  .sitrep { margin-top: 14px; padding: 12px 14px; }
  .sitrep p { font-size: 1rem; line-height: 1.5; }
  .sitrep__label { margin-bottom: 6px; }
  .decision { margin-top: 16px; }
  .option { padding: 12px 14px; }
}

/* ---------- stamps & completion ---------- */
.stamp { display: inline-flex; align-items: center; gap: 10px; font-family: var(--mono); font-size: 0.78rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--amber); border: 1.5px solid var(--amber); padding: 7px 12px; border-radius: 6px; margin-bottom: 14px; transform: rotate(-1.5deg); }
.stamp::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--amber); box-shadow: 0 0 10px var(--amber); }

/* ---------- buttons ---------- */
.actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 20px; align-items: center; }
.actions--end { justify-content: flex-end; }
.btn {
  font: inherit; font-weight: 700; font-size: 1rem; padding: 12px 22px; border-radius: 10px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 1.5px solid var(--amber); background: var(--amber); color: var(--amber-ink); min-width: 150px; letter-spacing: 0.01em;
  box-shadow: 0 6px 20px rgba(233,185,76,0.25);
}
.btn:hover { background: var(--amber-2); border-color: var(--amber-2); }
.btn:focus-visible { outline: 3px solid var(--signal); outline-offset: 2px; }
.btn:disabled { opacity: 0.55; cursor: not-allowed; }
.btn--secondary { background: transparent; color: var(--ink); border-color: var(--line-2); box-shadow: none; }
.btn--secondary:hover { background: rgba(255,255,255,0.05); border-color: var(--ink-3); }
.btn--quiet { background: transparent; border-color: transparent; color: var(--ink-2); min-width: 0; padding-left: 8px; padding-right: 8px; box-shadow: none; }
.btn--quiet:hover { background: rgba(255,255,255,0.05); border-color: transparent; }
.paper .btn--secondary { color: var(--paper-ink); border-color: #c9c1ad; }
.paper .btn--secondary:hover { background: #ece6d8; }
@media (max-width: 520px) { .btn { width: 100%; } .actions { flex-direction: column; align-items: stretch; } }

/* ---------- misc ---------- */
.alert { border-radius: 10px; padding: 12px 14px; font-size: 0.95rem; margin: 0 0 14px; }
.alert--error { background: rgba(255,143,143,0.12); color: var(--danger); border: 1px solid rgba(255,143,143,0.35); }
.alert--info { background: rgba(127,179,255,0.1); color: var(--ink); border: 1px solid rgba(127,179,255,0.35); }
.divider { border: 0; border-top: 1px solid var(--line); margin: 20px 0; }
.contact { font-size: 0.86rem; color: var(--ink-3); }
.mt-8 { margin-top: 8px; }
.mt-14 { margin-top: 14px; }
.mt-18 { margin-top: 18px; }
.visually-hidden { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- admin page (keeps the old top-bar shell) ---------- */
.topbar { background: var(--panel); color: #fff; border-bottom: 1px solid var(--line); }
.topbar__inner { max-width: 760px; margin: 0 auto; padding: 14px 16px 0; }
.brand { display: flex; align-items: center; gap: 10px; font-size: 14px; }
.brand__mark { width: 14px; height: 14px; border-radius: 3px; background: var(--amber); display: inline-block; }
.brand__name { font-weight: 600; }
.brand__sep { opacity: 0.5; }
.brand__app { opacity: 0.85; letter-spacing: 0.12em; font-family: var(--mono); font-size: 12px; }
.progress { height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; margin-top: 12px; overflow: hidden; }
.progress__fill { height: 100%; width: 0; background: var(--amber); }
.progress__fill--full { width: 100%; }
.app { width: 100%; max-width: 760px; margin: 0 auto; padding: 24px 16px 40px; position: relative; z-index: 1; }
.card { background: linear-gradient(180deg, var(--panel-2), var(--panel)); border: 1px solid var(--line); border-radius: var(--radius); padding: 28px; }
.card + .card { margin-top: 16px; }
.footer { text-align: center; font-size: 13px; color: var(--ink-3); padding: 12px 16px 28px; }
.admin table { width: 100%; border-collapse: collapse; margin: 12px 0 20px; font-size: 0.95rem; font-variant-numeric: tabular-nums; }
.admin th, .admin td { text-align: right; padding: 8px 10px; border-bottom: 1px solid var(--line); }
.admin th:first-child, .admin td:first-child { text-align: left; }
.admin thead th { color: var(--ink-3); font-weight: 600; font-size: 0.8rem; letter-spacing: 0.06em; text-transform: uppercase; }
.admin tfoot td { font-weight: 700; }
.admin code { background: rgba(0,0,0,0.3); padding: 2px 6px; border-radius: 6px; font-size: 0.9em; }

/* ---------- visual effects integration ---------- */
.fx-ambient-canvas { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
.desk { z-index: 1; }
.panel { position: relative; overflow: hidden; }
.hud__extras:empty { display: none; }
@media (max-width: 860px) { .hud__extras { display: none; } }


/* one-time boot splash over the sign-in screen */
.boot { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: radial-gradient(900px 500px at 50% 40%, #142040, var(--ground) 70%); animation: bootIn 300ms ease; }
.boot::before { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0.35;
  background: repeating-linear-gradient(180deg, rgba(255,255,255,0.04) 0 1px, transparent 1px 4px); }
.boot--out { animation: bootOut 420ms ease forwards; }
.boot__inner { position: relative; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 0 24px; }
.mark--lg { width: 56px; height: 56px; border-radius: 14px; margin-bottom: 8px; animation: markPulse 1.6s ease-in-out infinite; }
.boot__title { font-family: var(--mono); font-size: 1.6rem; letter-spacing: 0.42em; color: var(--amber); margin-left: 0.42em; }
.boot__sub { font-size: 0.9rem; color: var(--ink-2); letter-spacing: 0.08em; text-transform: uppercase; }
.boot__line { width: min(360px, 70vw); height: 2px; background: rgba(255,255,255,0.08); border-radius: 1px; overflow: hidden; margin-top: 14px; }
.boot__line i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--amber), var(--amber-2)); box-shadow: 0 0 12px var(--amber); animation: bootLine 1.3s cubic-bezier(.2,.6,.2,1) forwards; }
.boot__log { position: relative; height: 1.4em; width: min(360px, 70vw); font-family: var(--mono); font-size: 0.72rem; color: var(--ink-3); letter-spacing: 0.1em; text-transform: uppercase; }
.boot__log span { position: absolute; inset: 0; opacity: 0; animation: bootLog 1.5s linear forwards; }
.boot__log span:nth-child(2) { animation-delay: 0.45s; }
.boot__log span:nth-child(3) { animation-delay: 0.9s; }
@keyframes bootIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes bootOut { to { opacity: 0; transform: scale(1.02); } }
@keyframes bootLine { to { width: 100%; } }
@keyframes bootLog { 0% { opacity: 0; } 10% { opacity: 1; } 30% { opacity: 1; } 40% { opacity: 0; } 100% { opacity: 0; } }
@keyframes markPulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(233,185,76,0.4), 0 6px 18px rgba(233,185,76,0.25); } 50% { box-shadow: 0 0 0 14px rgba(233,185,76,0), 0 6px 24px rgba(233,185,76,0.45); } }
@media (prefers-reduced-motion: reduce) { .boot, .boot * { animation: none !important; } }

/* THRESHOLD fx: "cyber" vignette — styles and motion.
   Class prefix fx-cyber-, keyframe prefix fxcyber-. Palette: ground/panel/amber/signal tokens only.
   The container decides the size; the SVG fills it (viewBox 760x200, slice). */

.fx-cyber {
  display: block;
  width: 100%;
  height: 100%;
  pointer-events: none;
  user-select: none;
}

.fx-cyber-glyphs text {
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  font-weight: 500;
}

/* ---- background drift ---- */
.fx-cyber-hexgrid {
  animation: fxcyber-drift 14s ease-in-out infinite alternate;
}

/* ---- core: shield rotates, inner hex counter-rotates, outer ring crawls, sweep turns ---- */
.fx-cyber-shield {
  transform-origin: 0 0;
  animation: fxcyber-spin 28s linear infinite;
}
.fx-cyber-shield-inner {
  transform-origin: 0 0;
  animation: fxcyber-spin-rev 18s linear infinite;
}
.fx-cyber-ring-outer {
  transform-origin: 0 0;
  animation: fxcyber-spin-rev 40s linear infinite;
}
.fx-cyber-sweep {
  transform-origin: 0 0;
  animation: fxcyber-spin 6s linear infinite;
}
.fx-cyber-heart {
  transform-origin: 0 0;
  animation: fxcyber-heart 4s ease-in-out infinite;
}
.fx-cyber-arcs {
  transform-origin: 0 0;
  animation: fxcyber-spin-rev 22s linear infinite;
}
.fx-cyber-arcs-b {
  transform-origin: 0 0;
  animation: fxcyber-spin 34s linear infinite;
}
.fx-cyber-node-orbit {
  transform-origin: 0 0;
  animation: fxcyber-spin 12s linear infinite;
}

/* ---- node pulses: ring grows and fades, staggered ---- */
.fx-cyber-pulse {
  transform-origin: 0 0;
  opacity: 0;
  animation: fxcyber-pulse 7s ease-out infinite;
}
.fx-cyber-pulse--v1 { animation-delay: 0s; }
.fx-cyber-pulse--v2 { animation-delay: 1.3s; }
.fx-cyber-pulse--v3 { animation-delay: 2.5s; }
.fx-cyber-pulse--v4 { animation-delay: 3.6s; }
.fx-cyber-pulse--v5 { animation-delay: 4.8s; }
.fx-cyber-pulse--v6 { animation-delay: 5.9s; }

/* ---- edges breathe very slowly (amber core links a touch brighter) ---- */
.fx-cyber-edge--a { animation: fxcyber-breathe 9s ease-in-out infinite; }
.fx-cyber-edge--s { animation: fxcyber-breathe-soft 11s ease-in-out infinite; }

/* ---- HUD: slow horizontal scan bar, two glyphs blink gently ---- */
.fx-cyber-bar {
  animation: fxcyber-bar 13s cubic-bezier(0.45, 0, 0.55, 1) infinite;
}
.fx-cyber-blink { animation: fxcyber-blink 5s ease-in-out infinite; }
.fx-cyber-blink--b { animation-delay: 2.4s; animation-duration: 7s; }

/* ---- keyframes ---- */
@keyframes fxcyber-spin      { from { transform: rotate(0deg); }   to { transform: rotate(360deg); } }
@keyframes fxcyber-spin-rev  { from { transform: rotate(0deg); }   to { transform: rotate(-360deg); } }
@keyframes fxcyber-drift     { from { transform: translate(0, 0); } to { transform: translate(-16px, -9px); } }
@keyframes fxcyber-heart {
  0%, 100% { transform: scale(1);    opacity: 0.95; }
  50%      { transform: scale(1.35); opacity: 1; }
}
@keyframes fxcyber-pulse {
  0%   { transform: scale(0.6); opacity: 0; }
  8%   { opacity: 0.7; }
  45%  { transform: scale(3.2); opacity: 0; }
  100% { transform: scale(3.2); opacity: 0; }
}
@keyframes fxcyber-breathe      { 0%, 100% { opacity: 0.55; } 50% { opacity: 0.85; } }
@keyframes fxcyber-breathe-soft { 0%, 100% { opacity: 0.32; } 50% { opacity: 0.5; } }
@keyframes fxcyber-bar {
  0%   { transform: translateX(0); }
  100% { transform: translateX(830px); }
}
@keyframes fxcyber-blink {
  0%, 100% { opacity: 1; }
  50%      { opacity: 0.35; }
}

/* ---- reduced motion: a complete static frame ---- */
@media (prefers-reduced-motion: reduce) {
  .fx-cyber *, .fx-cyber { animation: none !important; }
  .fx-cyber-packets { display: none; }
  .fx-cyber-bar { display: none; }
  .fx-cyber-pulse { opacity: 0.35; transform: scale(1.8); }
  .fx-cyber-sweep { transform: rotate(32deg); }
}

/* THRESHOLD fx module: "supply" vignette (public/fx/supply.js).
   Route-map banner for the Supply chain incident card. Decorative only.
   Palette: ground/panel navies, --amber HUD accent, --signal blue. No red/green.
   Container: give the wrapper an explicit height (about 200px desktop, 160px phone);
   the SVG uses preserveAspectRatio="xMidYMid slice" and fills it. */

.fx-supply {
  display: block;
  width: 100%;
  height: 100%;
  background: #0a1020;
}

.fx-supply-text {
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  font-size: 7.5px;
  letter-spacing: 0.3em;
}
.fx-supply-text-r { text-anchor: end; }

/* ---------- lanes: slow dash drift, each lane at its own pace ---------- */
.fx-supply-lane {
  stroke-dasharray: 5 9;
  opacity: 0.75;
  animation: fxsupply-dash 9s linear infinite;
}
.fx-supply-lane-b { animation-duration: 11s; animation-direction: reverse; }
.fx-supply-lane-c { animation-duration: 13s; }
.fx-supply-lane-d { animation-duration: 10s; animation-direction: reverse; }
.fx-supply-landroute {
  stroke-dasharray: 2.5 6;
  opacity: 0.8;
  animation: fxsupply-dash-land 14s linear infinite;
}
@keyframes fxsupply-dash { to { stroke-dashoffset: -112; } }
@keyframes fxsupply-dash-land { to { stroke-dashoffset: -102; } }

/* ---------- moving glyphs along the lanes (CSS motion path) ---------- */
.fx-supply-vessel {
  offset-rotate: auto;
  offset-distance: 0%;
  animation: fxsupply-travel 16s linear infinite;
}
.fx-supply-hull { fill: #131d33; stroke: #7fb3ff; stroke-width: 1.2; stroke-linejoin: round; }
.fx-supply-box { fill: #0a1020; stroke: #f3cf7a; stroke-width: 1; }
.fx-supply-vessel-light { fill: #7fb3ff; opacity: 0.1; }
.fx-supply-wake { fill: none; stroke: #7fb3ff; stroke-width: 1; stroke-linecap: round; stroke-dasharray: 3 3; opacity: 0.45; animation: fxsupply-wake 1.6s linear infinite; }
.fx-supply-wake-land { stroke: #e9b94c; }
@keyframes fxsupply-wake { to { stroke-dashoffset: -6; } }
.fx-supply-depot { animation: fxsupply-depot 7s ease-in-out infinite; }
.fx-supply-depot-2 { animation-delay: -2.3s; }
.fx-supply-depot-3 { animation-delay: -4.6s; }
@keyframes fxsupply-depot {
  0%, 100% { stroke: #aab6d0; }
  50%      { stroke: #f3cf7a; }
}

.fx-supply-v-a1 { offset-path: path('M205 70 Q 300 56 400 100'); animation-duration: 18s; animation-delay: -4s; }
.fx-supply-v-a2 { offset-path: path('M205 70 Q 300 56 400 100'); animation-duration: 18s; animation-delay: -13s; animation-direction: reverse; }
.fx-supply-v-b1 { offset-path: path('M640 35 Q 520 48 400 100'); animation-duration: 20s; animation-delay: -9s; }
.fx-supply-v-c1 { offset-path: path('M120 85 Q 260 104 400 100'); animation-duration: 24s; animation-delay: -6s; animation-direction: reverse; }
.fx-supply-v-d1 { offset-path: path('M400 100 Q 330 150 240 128'); animation-duration: 17s; animation-delay: -11s; }
.fx-supply-t-1 { offset-path: path('M400 100 C 430 128 480 142 540 150 C 580 158 620 150 660 135'); animation-duration: 22s; animation-delay: -5s; }
.fx-supply-t-2 { offset-path: path('M400 100 C 430 128 480 142 540 150 C 580 158 620 150 660 135'); animation-duration: 22s; animation-delay: -16s; animation-direction: reverse; }
.fx-supply-t-1 .fx-supply-hull, .fx-supply-t-2 .fx-supply-hull { stroke: #e9b94c; }
.fx-supply-t-1 .fx-supply-vessel-light, .fx-supply-t-2 .fx-supply-vessel-light { fill: #e9b94c; }

@keyframes fxsupply-travel {
  0%   { offset-distance: 0%;   opacity: 0; }
  4%   { opacity: 1; }
  96%  { opacity: 1; }
  100% { offset-distance: 100%; opacity: 0; }
}

/* ---------- ports: gentle breathing halos ---------- */
.fx-supply-port-halo { fill: #7fb3ff; opacity: 0.1; animation: fxsupply-halo 6s ease-in-out infinite; }
.fx-supply-port-ring { fill: none; stroke: #7fb3ff; stroke-width: 1.1; opacity: 0.8; }
.fx-supply-port-dot { fill: #e8edf8; opacity: 0.9; }
.fx-supply-port-mid .fx-supply-port-halo { animation-delay: -2s; }
.fx-supply-port-late .fx-supply-port-halo { animation-delay: -4s; }
@keyframes fxsupply-halo {
  0%, 100% { opacity: 0.08; transform: scale(0.8); }
  50%      { opacity: 0.22; transform: scale(1.15); }
}

/* ---------- main hub: expanding radial ping + counter-rotating orbit rings ---------- */
.fx-supply-ping-ring {
  transform-origin: 0 0;
  transform: scale(0.15);
  opacity: 0;
  animation: fxsupply-ping 7.5s cubic-bezier(0.2, 0.6, 0.4, 1) infinite;
}
.fx-supply-ping-2 { animation-delay: -2.5s; }
.fx-supply-ping-3 { animation-delay: -5s; }
@keyframes fxsupply-ping {
  0%   { transform: scale(0.15); opacity: 0; }
  8%   { opacity: 0.75; }
  70%  { opacity: 0.12; }
  100% { transform: scale(1.5); opacity: 0; }
}
.fx-supply-hub-orbit { transform-origin: 0 0; animation: fxsupply-spin 26s linear infinite; }
.fx-supply-hub-orbit-2 { transform-origin: 0 0; animation: fxsupply-spin 40s linear infinite reverse; }
@keyframes fxsupply-spin { to { transform: rotate(360deg); } }
.fx-supply-hub-dot { animation: fxsupply-breathe 4s ease-in-out infinite; }
@keyframes fxsupply-breathe {
  0%, 100% { opacity: 0.7; }
  50%      { opacity: 1; }
}
.fx-supply-hubpool { animation: fxsupply-pool 9s ease-in-out infinite; }
@keyframes fxsupply-pool {
  0%, 100% { opacity: 0.7; }
  50%      { opacity: 1; }
}

/* ---------- compass needle: slow wander, never settles on a direction ---------- */
.fx-supply-compass-needle { transform-origin: 0 0; animation: fxsupply-needle 19s ease-in-out infinite; }
@keyframes fxsupply-needle {
  0%   { transform: rotate(-18deg); }
  35%  { transform: rotate(24deg); }
  65%  { transform: rotate(-6deg); }
  100% { transform: rotate(-18deg); }
}

/* ---------- sweep + cursor + HUD ---------- */
.fx-supply-sweep {
  transform: translateX(-200px);
  animation: fxsupply-sweep 14s cubic-bezier(0.4, 0, 0.6, 1) infinite;
  mix-blend-mode: screen;
}
@keyframes fxsupply-sweep {
  0%   { transform: translateX(-200px); }
  100% { transform: translateX(800px); }
}
.fx-supply-cursor {
  transform: translate(330px, 60px);
  animation: fxsupply-cursor 21s ease-in-out infinite;
}
@keyframes fxsupply-cursor {
  0%, 12%  { transform: translate(330px, 60px); }
  28%, 42% { transform: translate(470px, 128px); }
  58%, 70% { transform: translate(290px, 118px); }
  86%, 100% { transform: translate(330px, 60px); }
}
.fx-supply-text-blink { animation: fxsupply-blink 5s ease-in-out infinite; }
@keyframes fxsupply-blink {
  0%, 100% { opacity: 1; }
  50%      { opacity: 0.35; }
}
.fx-supply-coastglow { animation: fxsupply-coast 12s ease-in-out infinite; }
@keyframes fxsupply-coast {
  0%, 100% { opacity: 0.12; }
  50%      { opacity: 0.24; }
}

/* ---------- reduced motion: a complete static frame ---------- */
@media (prefers-reduced-motion: reduce) {
  .fx-supply *, .fx-supply { animation: none !important; }
  .fx-supply-vessel { opacity: 1; }
  .fx-supply-v-a1 { offset-distance: 38%; }
  .fx-supply-v-a2 { offset-distance: 72%; }
  .fx-supply-v-b1 { offset-distance: 55%; }
  .fx-supply-v-c1 { offset-distance: 30%; }
  .fx-supply-v-d1 { offset-distance: 60%; }
  .fx-supply-t-1 { offset-distance: 35%; }
  .fx-supply-t-2 { offset-distance: 78%; }
  .fx-supply-ping-1 { transform: scale(0.55); opacity: 0.45; }
  .fx-supply-ping-2 { transform: scale(1); opacity: 0.22; }
  .fx-supply-ping-3 { transform: scale(1.4); opacity: 0.08; }
  .fx-supply-port-halo { opacity: 0.15; transform: scale(1); }
  .fx-supply-sweep { transform: translateX(260px); opacity: 0.6; }
  .fx-supply-cursor { transform: translate(330px, 60px); }
}

/* THRESHOLD fx: "audit" vignette — styles and motion.
   Class prefix fx-audit-, keyframe prefix fxaudit-. Palette: ground/panel/amber/signal tokens only.
   The container decides the size; the SVG fills it (viewBox 760x200, slice).

   Timing: one 14s "audit pass". The row highlight walks down the eight ledger rows between 8% and 57%
   of the cycle; each check glyph draws itself as the highlight reaches its row (7% apart), every check
   holds, then all of them fade together at 86-93% and the pass starts again. The seal and dial run on
   their own slow, continuous loops so the scene never sits still. */

.fx-audit {
  display: block;
  width: 100%;
  height: 100%;
  pointer-events: none;
  user-select: none;
}

.fx-audit-glyphs text {
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  font-weight: 500;
}

/* ---- background: ruled paper drifts very slowly ---- */
.fx-audit-paper {
  animation: fxaudit-drift 16s ease-in-out infinite alternate;
}

/* ---- motes: specks rise slowly and fade, staggered ---- */
.fx-audit-mote {
  animation: fxaudit-mote 12s ease-in-out infinite;
}
.fx-audit-mote--v1 { animation-delay: 0s; }
.fx-audit-mote--v2 { animation-delay: -1.7s; animation-duration: 14s; }
.fx-audit-mote--v3 { animation-delay: -3.1s; }
.fx-audit-mote--v4 { animation-delay: -4.9s; animation-duration: 13s; }
.fx-audit-mote--v5 { animation-delay: -6.2s; }
.fx-audit-mote--v6 { animation-delay: -7.8s; animation-duration: 11s; }
.fx-audit-mote--v7 { animation-delay: -9.3s; }
.fx-audit-mote--v8 { animation-delay: -10.6s; animation-duration: 13s; }

/* ---- ledger: row highlight walks the rows, checks land one by one ---- */
.fx-audit-rowscan {
  animation: fxaudit-rowscan 14s linear infinite;
}
.fx-audit-check {
  animation: fxaudit-check-1 14s linear infinite;
}
.fx-audit-check--1 { animation-name: fxaudit-check-1; }
.fx-audit-check--2 { animation-name: fxaudit-check-2; }
.fx-audit-check--3 { animation-name: fxaudit-check-3; }
.fx-audit-check--4 { animation-name: fxaudit-check-4; }
.fx-audit-check--5 { animation-name: fxaudit-check-5; }
.fx-audit-check--6 { animation-name: fxaudit-check-6; }
.fx-audit-check--7 { animation-name: fxaudit-check-7; }
.fx-audit-check--8 { animation-name: fxaudit-check-8; }

.fx-audit-check-halo {
  transform-origin: 13.5px 0;
  animation: fxaudit-halo 14s ease-out infinite;
}
.fx-audit-check-halo--1 { animation-delay: 1.12s; }
.fx-audit-check-halo--2 { animation-delay: 2.10s; }
.fx-audit-check-halo--3 { animation-delay: 3.08s; }
.fx-audit-check-halo--4 { animation-delay: 4.06s; }
.fx-audit-check-halo--5 { animation-delay: 5.04s; }
.fx-audit-check-halo--6 { animation-delay: 6.02s; }
.fx-audit-check-halo--7 { animation-delay: 7.00s; }
.fx-audit-check-halo--8 { animation-delay: 7.98s; }

.fx-audit-row { animation: fxaudit-breathe 9s ease-in-out infinite; }
.fx-audit-row--2, .fx-audit-row--6 { animation-delay: -2s; }
.fx-audit-row--3, .fx-audit-row--7 { animation-delay: -4s; }
.fx-audit-row--4, .fx-audit-row--8 { animation-delay: -6s; }

.fx-audit-ledger-bracket { animation: fxaudit-breathe-soft 7s ease-in-out infinite; }

/* ---- controls dial: tick ring crawls, dashed ring counter-rotates, arcs orbit, heart breathes ---- */
.fx-audit-dial-ticks {
  transform-origin: 0 0;
  animation: fxaudit-spin 48s linear infinite;
}
.fx-audit-dial-dash {
  transform-origin: 0 0;
  animation: fxaudit-spin-rev 30s linear infinite;
}
.fx-audit-dial-arcs {
  transform-origin: 0 0;
  animation: fxaudit-spin 20s linear infinite;
}
.fx-audit-dial-arcs-b {
  transform-origin: 0 0;
  animation: fxaudit-spin-rev 36s linear infinite;
}
.fx-audit-dial-inner {
  transform-origin: 0 0;
  animation: fxaudit-spin-rev 14s linear infinite;
}
.fx-audit-dial-orbit {
  transform-origin: 0 0;
  animation: fxaudit-spin 26s linear infinite;
}
.fx-audit-signature { animation: fxaudit-breathe-soft 10s ease-in-out infinite; }
.fx-audit-dial-heart {
  transform-origin: 0 0;
  animation: fxaudit-heart 5s ease-in-out infinite;
}
.fx-audit-dial-reticle { animation: fxaudit-breathe-soft 8s ease-in-out infinite; }

/* ---- document: a reading line passes down the sheet; the seal turns and glows ---- */
.fx-audit-docscan {
  animation: fxaudit-docscan 11s ease-in-out infinite;
}
.fx-audit-seal-ring {
  transform-origin: 0 0;
  animation: fxaudit-spin 40s linear infinite;
}
.fx-audit-seal-inner {
  transform-origin: 0 0;
  animation: fxaudit-spin-rev 22s linear infinite;
}
.fx-audit-seal-glow {
  transform-origin: 0 0;
  animation: fxaudit-sealglow 6s ease-in-out infinite;
}
.fx-audit-seal-ribbon { animation: fxaudit-breathe-soft 6s ease-in-out infinite; }

/* ---- HUD: slow full-width sweep, glyphs blink gently ---- */
.fx-audit-bar {
  animation: fxaudit-bar 17s cubic-bezier(0.45, 0, 0.55, 1) infinite;
}
.fx-audit-blink { animation: fxaudit-blink 5s ease-in-out infinite; }
.fx-audit-blink--b { animation-delay: 2.4s; animation-duration: 7s; }

/* ---- keyframes ---- */
@keyframes fxaudit-spin      { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
@keyframes fxaudit-spin-rev  { from { transform: rotate(0deg); } to { transform: rotate(-360deg); } }
@keyframes fxaudit-drift     { from { transform: translate(0, 0); } to { transform: translate(-12px, -7px); } }
@keyframes fxaudit-breathe      { 0%, 100% { opacity: 0.78; } 50% { opacity: 1; } }
@keyframes fxaudit-breathe-soft { 0%, 100% { opacity: 0.55; } 50% { opacity: 0.9; } }
@keyframes fxaudit-blink        { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
@keyframes fxaudit-heart {
  0%, 100% { transform: scale(1);    opacity: 0.92; }
  50%      { transform: scale(1.35); opacity: 1; }
}
@keyframes fxaudit-sealglow {
  0%, 100% { transform: scale(0.92); opacity: 0.7; }
  50%      { transform: scale(1.08); opacity: 1; }
}
@keyframes fxaudit-mote {
  0%   { transform: translate(0, 0);       opacity: 0; }
  15%  { opacity: 0.75; }
  85%  { opacity: 0.55; }
  100% { transform: translate(6px, -34px); opacity: 0; }
}
@keyframes fxaudit-bar {
  0%   { transform: translateX(0); }
  100% { transform: translateX(830px); }
}

/* Row highlight: rows sit 13 viewBox units apart, so row 8 is 91 units below row 1. */
@keyframes fxaudit-rowscan {
  0%   { transform: translateY(0);    opacity: 0; }
  8%   { transform: translateY(0);    opacity: 1; }
  57%  { transform: translateY(91px); opacity: 1; }
  86%  { transform: translateY(91px); opacity: 1; }
  92%  { transform: translateY(91px); opacity: 0; }
  93%  { transform: translateY(0);    opacity: 0; }
  100% { transform: translateY(0);    opacity: 0; }
}

/* Document reading line: sheet is 112 units tall. */
@keyframes fxaudit-docscan {
  0%   { transform: translateY(6px);   opacity: 0; }
  10%  { opacity: 1; }
  90%  { opacity: 1; }
  100% { transform: translateY(106px); opacity: 0; }
}

/* Landing halo: a soft ring blooms when a check settles. */
@keyframes fxaudit-halo {
  0%    { transform: scale(0.4); opacity: 0; }
  1%    { opacity: 0.38; }
  6%    { transform: scale(1.6); opacity: 0; }
  100%  { transform: scale(1.6); opacity: 0; }
}

/* Check glyphs: each draws in over 3% of the cycle as the highlight reaches its row; all fade at 86-93%. */
@keyframes fxaudit-check-1 {
  0%, 8%     { stroke-dashoffset: 11; opacity: 0; }
  11%, 86%   { stroke-dashoffset: 0;  opacity: 0.95; }
  93%, 100%  { stroke-dashoffset: 0;  opacity: 0; }
}
@keyframes fxaudit-check-2 {
  0%, 15%    { stroke-dashoffset: 11; opacity: 0; }
  18%, 86%   { stroke-dashoffset: 0;  opacity: 0.95; }
  93%, 100%  { stroke-dashoffset: 0;  opacity: 0; }
}
@keyframes fxaudit-check-3 {
  0%, 22%    { stroke-dashoffset: 11; opacity: 0; }
  25%, 86%   { stroke-dashoffset: 0;  opacity: 0.95; }
  93%, 100%  { stroke-dashoffset: 0;  opacity: 0; }
}
@keyframes fxaudit-check-4 {
  0%, 29%    { stroke-dashoffset: 11; opacity: 0; }
  32%, 86%   { stroke-dashoffset: 0;  opacity: 0.95; }
  93%, 100%  { stroke-dashoffset: 0;  opacity: 0; }
}
@keyframes fxaudit-check-5 {
  0%, 36%    { stroke-dashoffset: 11; opacity: 0; }
  39%, 86%   { stroke-dashoffset: 0;  opacity: 0.95; }
  93%, 100%  { stroke-dashoffset: 0;  opacity: 0; }
}
@keyframes fxaudit-check-6 {
  0%, 43%    { stroke-dashoffset: 11; opacity: 0; }
  46%, 86%   { stroke-dashoffset: 0;  opacity: 0.95; }
  93%, 100%  { stroke-dashoffset: 0;  opacity: 0; }
}
@keyframes fxaudit-check-7 {
  0%, 50%    { stroke-dashoffset: 11; opacity: 0; }
  53%, 86%   { stroke-dashoffset: 0;  opacity: 0.95; }
  93%, 100%  { stroke-dashoffset: 0;  opacity: 0; }
}
@keyframes fxaudit-check-8 {
  0%, 57%    { stroke-dashoffset: 11; opacity: 0; }
  60%, 86%   { stroke-dashoffset: 0;  opacity: 0.95; }
  93%, 100%  { stroke-dashoffset: 0;  opacity: 0; }
}

/* ---- reduced motion: a complete static frame (all checks settled, highlight parked, sweeps hidden) ---- */
@media (prefers-reduced-motion: reduce) {
  .fx-audit *, .fx-audit { animation: none !important; }
  .fx-audit-bar { display: none; }
  .fx-audit-docscan { display: none; }
  .fx-audit-check-halo { display: none; }
  .fx-audit-mote { opacity: 0.5; }
  .fx-audit-check { stroke-dashoffset: 0; opacity: 0.95; }
  .fx-audit-rowscan { transform: translateY(91px); opacity: 0.8; }
  .fx-audit-seal-glow { opacity: 0.85; }
}

/* THRESHOLD fx: "regulatory" vignette — styles and motion.
   Class prefix fx-regulatory-, keyframe prefix fxregulatory-. Palette: ground/panel/amber/signal tokens only.
   The container decides the size; the SVG fills it (viewBox 760x200, slice).
   Every animated group sits inside a translate() parent, so transform-origin 0 0 is the right pivot. */

.fx-regulatory {
  display: block;
  width: 100%;
  height: 100%;
  pointer-events: none;
  user-select: none;
}

.fx-regulatory-glyphs text,
.fx-regulatory-motes text {
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  font-weight: 500;
}

/* ---- background ---- */
.fx-regulatory-grid { animation: fxregulatory-drift 16s ease-in-out infinite alternate; }
.fx-regulatory-sealhalo { animation: fxregulatory-breathe-halo 9s ease-in-out infinite; }
.fx-regulatory-facade { animation: fxregulatory-breathe-soft 12s ease-in-out infinite; }

/* floor rails: dashes crawl outward from the centre (both sides mirror each other) */
.fx-regulatory-rail { animation: fxregulatory-crawl 6s linear infinite; }

/* section glyph motes bob gently in place */
.fx-regulatory-mote { opacity: 0.22; animation: fxregulatory-bob 9s ease-in-out infinite; }
.fx-regulatory-mote--2 { animation-delay: -2s;  animation-duration: 11s; }
.fx-regulatory-mote--3 { animation-delay: -4s;  animation-duration: 8s; }
.fx-regulatory-mote--4 { animation-delay: -6s;  animation-duration: 12s; }
.fx-regulatory-mote--5 { animation-delay: -1s;  animation-duration: 10s; }
.fx-regulatory-mote--6 { animation-delay: -7s;  animation-duration: 9.5s; }

/* ---- documents: scan line travels down the front sheet, stack breathes ---- */
.fx-regulatory-docscan { animation: fxregulatory-docscan 5.5s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
.fx-regulatory-sheet--2 { animation: fxregulatory-breathe-soft 7s ease-in-out infinite; }
.fx-regulatory-sheet--3 { animation: fxregulatory-breathe-soft 7s ease-in-out -3.5s infinite; }
.fx-regulatory-tag { animation: fxregulatory-blink 6s ease-in-out infinite; }

/* ---- scales: the beam sways; each pan counter-rotates by the same angle so it hangs level.
   Both use the same duration and easing, so the pair is perfectly symmetric and never settles. ---- */
.fx-regulatory-beam {
  transform-origin: 0 0;
  animation: fxregulatory-sway 10s ease-in-out infinite;
}
.fx-regulatory-pan {
  transform-origin: 0 0;
  animation: fxregulatory-sway-rev 10s ease-in-out infinite;
}
.fx-regulatory-orbit   { transform-origin: 0 0; animation: fxregulatory-spin 14s linear infinite; }
.fx-regulatory-bigorbit   { transform-origin: 0 0; animation: fxregulatory-spin 48s linear infinite; }
.fx-regulatory-bigorbit-b { transform-origin: 0 0; animation: fxregulatory-spin-rev 36s linear infinite; }
.fx-regulatory-orbit-b { transform-origin: 0 0; animation: fxregulatory-spin-rev 26s linear infinite; }
.fx-regulatory-hub     { transform-origin: 0 0; animation: fxregulatory-heart 4s ease-in-out infinite; }
.fx-regulatory-panring { animation: fxregulatory-breathe-soft 5s ease-in-out infinite; }

.fx-regulatory-pulse {
  transform-origin: 0 0;
  opacity: 0;
  animation: fxregulatory-pulse 8s ease-out infinite;
}
.fx-regulatory-pulse--2 { animation-delay: 4s; }

/* ---- seal: tick ring turns, dashed ring counter-turns, stars breathe ---- */
.fx-regulatory-seal-ticks  { transform-origin: 0 0; animation: fxregulatory-spin 40s linear infinite; }
.fx-regulatory-seal-dash   { transform-origin: 0 0; animation: fxregulatory-spin-rev 24s linear infinite; }
.fx-regulatory-seal-laurel { transform-origin: 0 0; animation: fxregulatory-breathe 8s ease-in-out infinite; }
.fx-regulatory-seal-star   { transform-origin: 0 0; animation: fxregulatory-spin 60s linear infinite; }
.fx-regulatory-seal-star-b { transform-origin: 0 0; animation: fxregulatory-spin-rev 30s linear infinite; }
.fx-regulatory-seal-core   { transform-origin: 0 0; animation: fxregulatory-heart 6s ease-in-out -2s infinite; }

/* ---- HUD: slow horizontal scan bar, two glyphs blink gently ---- */
.fx-regulatory-bar { animation: fxregulatory-bar 15s cubic-bezier(0.45, 0, 0.55, 1) infinite; }
.fx-regulatory-blink { animation: fxregulatory-blink 5s ease-in-out infinite; }
.fx-regulatory-blink--b { animation-delay: 2.4s; animation-duration: 7s; }
.fx-regulatory-reticle { animation: fxregulatory-breathe-soft 10s ease-in-out infinite; }
.fx-regulatory-led { opacity: 0.18; animation: fxregulatory-led 6s ease-in-out infinite; }
.fx-regulatory-led--2 { animation-delay: 0.5s; }
.fx-regulatory-led--3 { animation-delay: 1s; }
.fx-regulatory-led--4 { animation-delay: 1.5s; }
.fx-regulatory-led--5 { animation-delay: 2s; }
.fx-regulatory-led--6 { animation-delay: 2.5s; }

/* ---- keyframes ---- */
@keyframes fxregulatory-spin     { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
@keyframes fxregulatory-spin-rev { from { transform: rotate(0deg); } to { transform: rotate(-360deg); } }
@keyframes fxregulatory-drift    { from { transform: translate(0, 0); } to { transform: translate(-14px, -8px); } }

/* four segments so the ease-in-out between keyframes approximates a sine: equal time near level and at the turns */
@keyframes fxregulatory-sway {
  0%, 100% { transform: rotate(-1.8deg); }
  25%      { transform: rotate(0deg); }
  50%      { transform: rotate(1.8deg); }
  75%      { transform: rotate(0deg); }
}
@keyframes fxregulatory-sway-rev {
  0%, 100% { transform: rotate(1.8deg); }
  25%      { transform: rotate(0deg); }
  50%      { transform: rotate(-1.8deg); }
  75%      { transform: rotate(0deg); }
}
@keyframes fxregulatory-heart {
  0%, 100% { transform: scale(1);    opacity: 0.95; }
  50%      { transform: scale(1.35); opacity: 1; }
}
@keyframes fxregulatory-pulse {
  0%   { transform: scale(0.6); opacity: 0; }
  8%   { opacity: 0.6; }
  45%  { transform: scale(3.4); opacity: 0; }
  100% { transform: scale(3.4); opacity: 0; }
}
@keyframes fxregulatory-docscan {
  0%   { transform: translateY(0px); opacity: 0; }
  8%   { opacity: 1; }
  82%  { opacity: 1; }
  92%, 100% { transform: translateY(92px); opacity: 0; }
}
@keyframes fxregulatory-crawl { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -56; } }
@keyframes fxregulatory-bob {
  0%, 100% { transform: translateY(0px);  opacity: 0.14; }
  50%      { transform: translateY(-6px); opacity: 0.3; }
}
@keyframes fxregulatory-breathe      { 0%, 100% { opacity: 0.55; } 50% { opacity: 0.9; } }
@keyframes fxregulatory-breathe-soft { 0%, 100% { opacity: 0.35; } 50% { opacity: 0.6; } }
@keyframes fxregulatory-breathe-halo { 0%, 100% { opacity: 0.6; }  50% { opacity: 1; } }
@keyframes fxregulatory-bar { 0% { transform: translateX(0); } 100% { transform: translateX(830px); } }
@keyframes fxregulatory-blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
@keyframes fxregulatory-led { 0%, 100% { opacity: 0.18; } 20% { opacity: 0.85; } 45% { opacity: 0.18; } }

/* ---- reduced motion: a complete static frame ---- */
@media (prefers-reduced-motion: reduce) {
  .fx-regulatory *, .fx-regulatory { animation: none !important; }
  .fx-regulatory-bar { display: none; }
  .fx-regulatory-pulse { opacity: 0.3; transform: scale(2); }
  .fx-regulatory-docscan { transform: translateY(38px); opacity: 1; }
  .fx-regulatory-mote { opacity: 0.2; }
  .fx-regulatory-led { opacity: 0.4; }
  .fx-regulatory-sheet--2, .fx-regulatory-sheet--3, .fx-regulatory-facade, .fx-regulatory-reticle, .fx-regulatory-panring { opacity: 0.5; }
}

/* THRESHOLD fx: "geo" vignette — styles and motion.
   Class prefix fx-geo-, keyframe prefix fxgeo-. Palette: ground/panel/amber/signal tokens only.
   The container decides the size; the SVG fills it (viewBox 760x200, slice).
   The globe spin and satellite motion are SMIL (see geo.js); everything here is CSS, including the
   fades that must stay in phase with that SMIL (meridian halves: 18s period, satellite: 24s period;
   mount() in geo.js keeps the two clocks aligned). Every fade is a keyframe on opacity only. */

.fx-geo {
  display: block;
  width: 100%;
  height: 100%;
  pointer-events: none;
  user-select: none;
}

.fx-geo-glyphs text {
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  font-weight: 500;
}

/* ---- background: grid drifts, star field twinkles (one group per variant), concentric rings crawl ---- */
.fx-geo-grid {
  animation: fxgeo-drift 16s ease-in-out infinite alternate;
}
.fx-geo-star {
  opacity: 0.5;
  animation: fxgeo-twinkle 5s ease-in-out infinite;
}
.fx-geo-star--v1 { animation-duration: 4.2s; animation-delay: -0.6s; }
.fx-geo-star--v2 { animation-duration: 6.1s; animation-delay: -2.4s; }
.fx-geo-star--v3 { animation-duration: 5.3s; animation-delay: -1.1s; }
.fx-geo-star--v4 { animation-duration: 7.4s; animation-delay: -3.9s; }
.fx-geo-star--v5 { animation-duration: 4.8s; animation-delay: -2.9s; }

.fx-geo-bgring { transform-origin: 380px 100px; }
.fx-geo-bgring--1 { animation: fxgeo-spin 60s linear infinite; }
.fx-geo-bgring--2 { animation: fxgeo-spin-rev 84s linear infinite; }
.fx-geo-bgring--3 { animation: fxgeo-spin 110s linear infinite; }

/* ---- globe: a soft scan line descends through the disc ---- */
.fx-geo-scanline {
  animation: fxgeo-scanline 7s cubic-bezier(.45,.05,.55,.95) infinite;
}

/* ---- meridians: each half-circle is bright while it faces the viewer and dim behind.
   Period and phase match the SMIL spin in geo.js (18s half turn, meridian i starts 3s*i in).
   The fade is on stroke-opacity, not opacity: Chromium promotes a CSS opacity animation on an SVG
   element to a composited layer, and these paths use non-scaling-stroke under a near-singular
   transform (the meridian seen edge-on), which gives that layer a gigantic bounds and pegs the
   renderer. stroke-opacity is a paint-only property, identical in effect on a stroke-only path. ---- */
.fx-geo-mhalf--r { animation: fxgeo-mhalf-r 18s linear infinite; }
.fx-geo-mhalf--l { animation: fxgeo-mhalf-l 18s linear infinite; }
.fx-geo-meridian--v2 .fx-geo-mhalf { animation-delay: -3s; }
.fx-geo-meridian--v3 .fx-geo-mhalf { animation-delay: -6s; }
.fx-geo-meridian--v4 .fx-geo-mhalf { animation-delay: -9s; }
.fx-geo-meridian--v5 .fx-geo-mhalf { animation-delay: -12s; }
.fx-geo-meridian--v6 .fx-geo-mhalf { animation-delay: -15s; }

/* ---- satellite: the front copy fades out while it is on the far side of the globe (24s orbit, -6s phase) ---- */
.fx-geo-sat--front { animation: fxgeo-sat-front 24s linear infinite; animation-delay: -6s; }

/* ---- markers: three expanding rings per marker, identical, staggered only by phase ---- */
.fx-geo-ring {
  transform-origin: 0 0;
  opacity: 0;
  animation: fxgeo-ring 4.2s cubic-bezier(.2,.6,.3,1) infinite;
}
.fx-geo-ring--b { animation-delay: -1.4s; }
.fx-geo-ring--c { animation-delay: -2.8s; }
.fx-geo-marker--v2 .fx-geo-ring { animation-delay: -0.9s; }
.fx-geo-marker--v2 .fx-geo-ring--b { animation-delay: -2.3s; }
.fx-geo-marker--v2 .fx-geo-ring--c { animation-delay: -3.7s; }
.fx-geo-marker--v3 .fx-geo-ring { animation-delay: -2.1s; }
.fx-geo-marker--v3 .fx-geo-ring--b { animation-delay: -3.5s; }
.fx-geo-marker--v3 .fx-geo-ring--c { animation-delay: -0.7s; }

.fx-geo-lock {
  transform-origin: 0 0;
  animation: fxgeo-lock 6s ease-in-out infinite;
}
.fx-geo-marker--v2 .fx-geo-lock { animation-delay: -2s; }
.fx-geo-marker--v3 .fx-geo-lock { animation-delay: -4s; }

/* ---- arcs: a comet of light travels each arc (dash offset over pathLength=100) ---- */
.fx-geo-light--tail { animation: fxgeo-travel-tail 6.5s linear infinite; }
.fx-geo-light--head { animation: fxgeo-travel-head 6.5s linear infinite; }
.fx-geo-light--v2 { animation-delay: -2.2s; }
.fx-geo-light--v3 { animation-delay: -4.3s; }

/* ---- a slow amber ping expands from the globe ---- */
.fx-geo-ping {
  transform-origin: 0 0;
  opacity: 0;
  animation: fxgeo-ping 9s cubic-bezier(.2,.6,.3,1) infinite;
}

/* ---- HUD reticle rings around the globe ---- */
.fx-geo-orbitring {
  transform-origin: 0 0;
  animation: fxgeo-spin 48s linear infinite;
}
.fx-geo-orbitring-b {
  transform-origin: 0 0;
  animation: fxgeo-spin-rev 26s linear infinite;
}

/* ---- wings ---- */
.fx-geo-radar {
  transform-origin: 0 0;
  animation: fxgeo-spin 5.5s linear infinite;
}
.fx-geo-track { transform-origin: 0 0; }
.fx-geo-track--1 { animation: fxgeo-spin 14s linear infinite; }
.fx-geo-track--2 { animation: fxgeo-spin-60 19s linear infinite; }
.fx-geo-track--3 { animation: fxgeo-spin-m60 23s linear infinite; }

/* ---- HUD: slow horizontal scan bar, two glyphs blink gently ---- */
.fx-geo-bar {
  animation: fxgeo-bar 13s ease-in-out infinite;
}
.fx-geo-blink { animation: fxgeo-blink 5s ease-in-out infinite; }
.fx-geo-blink--b { animation-delay: -2.6s; animation-duration: 6.4s; }

/* ---- keyframes ---- */
@keyframes fxgeo-drift {
  from { transform: translate(0, 0); }
  to { transform: translate(14px, 9px); }
}
@keyframes fxgeo-twinkle {
  0%, 100% { opacity: 0.25; }
  50% { opacity: 0.85; }
}
@keyframes fxgeo-spin { to { transform: rotate(360deg); } }
@keyframes fxgeo-spin-rev { to { transform: rotate(-360deg); } }
@keyframes fxgeo-spin-60 { from { transform: rotate(60deg); } to { transform: rotate(420deg); } }
@keyframes fxgeo-spin-m60 { from { transform: rotate(-60deg); } to { transform: rotate(-420deg); } }
@keyframes fxgeo-scanline {
  0% { transform: translateY(-86px); opacity: 0; }
  10% { opacity: 1; }
  90% { opacity: 1; }
  100% { transform: translateY(86px); opacity: 0; }
}
@keyframes fxgeo-ring {
  0% { transform: scale(0.35); opacity: 0.85; }
  70% { opacity: 0.18; }
  100% { transform: scale(2.3); opacity: 0; }
}
@keyframes fxgeo-ping {
  0% { transform: scale(1); opacity: 0; }
  8% { opacity: 0.34; }
  100% { transform: scale(1.7); opacity: 0; }
}
@keyframes fxgeo-lock {
  0%, 100% { transform: scale(1); opacity: 0.75; }
  50% { transform: scale(1.18); opacity: 0.45; }
}
@keyframes fxgeo-travel-tail {
  from { stroke-dashoffset: 118; }
  to { stroke-dashoffset: 18; }
}
@keyframes fxgeo-travel-head {
  from { stroke-dashoffset: 104; }
  to { stroke-dashoffset: 4; }
}
@keyframes fxgeo-bar {
  0% { transform: translateX(120px); opacity: 0; }
  10% { opacity: 1; }
  90% { opacity: 1; }
  100% { transform: translateX(640px); opacity: 0; }
}
@keyframes fxgeo-blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.35; }
}
@keyframes fxgeo-mhalf-r {
  0%, 47% { stroke-opacity: 1; }
  50%, 97% { stroke-opacity: 0.16; }
  100% { stroke-opacity: 1; }
}
@keyframes fxgeo-mhalf-l {
  0%, 47% { stroke-opacity: 0.16; }
  50%, 97% { stroke-opacity: 1; }
  100% { stroke-opacity: 0.16; }
}
@keyframes fxgeo-sat-front {
  0%, 22% { opacity: 1; }
  27%, 73% { opacity: 0; }
  78%, 100% { opacity: 1; }
}

/* ---- reduced motion: a complete static frame. SMIL is paused by mount() in geo.js. ---- */
@media (prefers-reduced-motion: reduce) {
  .fx-geo *, .fx-geo { animation: none !important; }
  .fx-geo-light { display: none; }
  .fx-geo-bar { display: none; }
  .fx-geo-scanline { display: none; }
  .fx-geo-star { opacity: 0.55; }
  .fx-geo-ring { opacity: 0.3; transform: scale(1.4); }
  .fx-geo-ring--b { opacity: 0.15; transform: scale(2); }
  .fx-geo-ring--c { display: none; }
  .fx-geo-ping { display: none; }
  .fx-geo-radar { transform: rotate(40deg); }
  /* frozen pose (mount() parks SMIL at its phase-0 frame): meridians 4-6 are past the limb, so their left half faces the viewer */
  .fx-geo-meridian--v4 .fx-geo-mhalf--r, .fx-geo-meridian--v5 .fx-geo-mhalf--r, .fx-geo-meridian--v6 .fx-geo-mhalf--r { stroke-opacity: 0.16; }
  .fx-geo-meridian--v4 .fx-geo-mhalf--l, .fx-geo-meridian--v5 .fx-geo-mhalf--l, .fx-geo-meridian--v6 .fx-geo-mhalf--l { stroke-opacity: 1; }
}

/* THRESHOLD fx: Dr. Vale portrait — motion.
   Class prefix fx-portrait-, keyframe prefix fxportrait-. The .portrait container sets the size
   (150x200 desktop, 96x128 phone); the SVG fills it (viewBox 150x200, slice).
   Idle loop: the bust breathes (±1% about its base), the eyes blink about every 5 s, a thin signal
   sweep crosses the panel about every 8 s, the hex backdrop drifts and the reticle ring crawls.
   Nothing here varies with the participant, the condition or any decision. No filters on moving parts. */

.fx-portrait {
  display: block;
  width: 100%;
  height: 100%;
  pointer-events: none;
  user-select: none;
}

/* ---- bust: slow breathing about the base (pivot is the translate sandwich in the markup) ---- */
.fx-portrait-breathe {
  transform-origin: 0 0;
  animation: fxportrait-breathe 4.6s ease-in-out infinite;
}

/* ---- eyes: a short blink every ~5 s, closing on the eye line ---- */
.fx-portrait-blink {
  transform-origin: 0 0;
  animation: fxportrait-blink 5.2s linear infinite;
}

/* ---- signal sweep: a thin horizontal line crosses the panel, then rests off-screen until the next pass ---- */
.fx-portrait-sweep {
  transform: translateY(-12px);
  animation: fxportrait-sweep 8s linear infinite;
}

/* ---- backdrop: hex grid drifts, reticle ring crawls ---- */
.fx-portrait-hexgrid {
  animation: fxportrait-drift 22s ease-in-out infinite alternate;
}
.fx-portrait-ring {
  transform-origin: 0 0;
  transform-box: view-box;
  animation: fxportrait-ring 48s linear infinite;
}

/* ---- keyframes ---- */
@keyframes fxportrait-breathe {
  0%, 100% { transform: scale(1); }
  50%      { transform: scale(1.01, 1.012); }
}
@keyframes fxportrait-blink {
  0%, 93%  { transform: scaleY(1); }
  95.2%    { transform: scaleY(0.06); }
  97.4%, 100% { transform: scaleY(1); }
}
@keyframes fxportrait-sweep {
  0%   { transform: translateY(-12px); opacity: 0; }
  2%   { opacity: 1; }
  20%  { transform: translateY(212px); opacity: 1; }
  21%, 100% { transform: translateY(212px); opacity: 0; }
}
@keyframes fxportrait-drift {
  from { transform: translate(0, 0); }
  to   { transform: translate(-7px, -10px); }
}
@keyframes fxportrait-ring {
  from { transform: translate(75px, 92px) rotate(0deg); }
  to   { transform: translate(75px, 92px) rotate(360deg); }
}

/* ---- reduced motion: a complete static frame ---- */
@media (prefers-reduced-motion: reduce) {
  .fx-portrait *, .fx-portrait { animation: none !important; }
  .fx-portrait-sweep { display: none; }
  .fx-portrait-breathe, .fx-portrait-blink { transform: none; }
  .fx-portrait-ring { transform: translate(75px, 92px) rotate(-20deg); }
}

/* THRESHOLD fx: "ambient" — full-viewport background canvas behind the desk.
   Class prefix fx-ambient-. The canvas is painted by fx/ambient.js (mountAmbient); this file only
   positions it. It never captures pointer events and sits under the desk (z-index 0 vs .desk 1). */

.fx-ambient-canvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  z-index: 0;
  pointer-events: none;
  user-select: none;
  /* a whisper of depth so the particle layer reads as "behind glass" */
  opacity: 0.95;
  mix-blend-mode: screen;
}

@media (prefers-reduced-motion: reduce) {
  /* The JS paints one static frame and stops; nothing to animate here. */
  .fx-ambient-canvas { opacity: 0.9; }
}

@media print {
  .fx-ambient-canvas { display: none; }
}

/* THRESHOLD fx: "effects" — HUD extras and screen-transition effects.
   Class prefix fx-effects-, keyframe prefix fxeffects-. Palette: ground/panel/amber/signal tokens
   plus transparent whites only. No inline style attributes anywhere; JS sets element.style for
   positioning contexts, the stamp's resting transform and the decode height lock. Under
   prefers-reduced-motion every animation is removed and the artwork rests in its final state.
   Performance: nothing that moves carries a filter, and the looping HUD animates opacity and
   transform only (glows are static box-shadows); the glyph row and each tick group are lit by one
   moving highlight behind a block-shaped mask instead of one animator per block. */

/* =========================================================================================
   HUD extras (216px rail column)
   ========================================================================================= */
.fx-effects-hud {
  display: flex;
  flex-direction: column;
  gap: 8px;
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  color: #7b89a8;
  user-select: none;
  pointer-events: none;
}

.fx-effects-hud-head,
.fx-effects-hud-foot {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 0.6rem;
  letter-spacing: 0.24em;
  color: #7b89a8;
}
.fx-effects-hud-head i {
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, rgba(127, 179, 255, 0.45), rgba(127, 179, 255, 0.08));
}
.fx-effects-hud-foot { justify-content: space-between; }

/* six tiny glyph blocks that light in a slow travelling wave: the blocks are static, and one soft
   highlight slides along behind a mask shaped like the blocks (a single animator, transform only) */
.fx-effects-hud-glyphs {
  position: relative;
  display: inline-flex;
  gap: 3px;
  overflow: hidden;
  -webkit-mask-image: repeating-linear-gradient(90deg, #000 0 5px, transparent 5px 8px);
  mask-image: repeating-linear-gradient(90deg, #000 0 5px, transparent 5px 8px);
}
.fx-effects-hud-glyphs i {
  width: 5px;
  height: 7px;
  border-radius: 1px;
  background: #7fb3ff;
  opacity: 0.18;
}
.fx-effects-hud-glyphs::after {
  content: "";
  position: absolute;
  top: 0;
  bottom: 0;
  left: 0;
  width: 24px;
  background: linear-gradient(90deg, rgba(127, 179, 255, 0) 0%, rgba(127, 179, 255, 0.55) 35%, rgba(170, 205, 255, 0.85) 50%, rgba(127, 179, 255, 0.55) 65%, rgba(127, 179, 255, 0) 100%);
  transform: translateX(10px);
  animation: fxeffects-glyph 4.8s ease-in-out infinite;
}
@keyframes fxeffects-glyph {
  0% { transform: translateX(-24px); }
  55% { transform: translateX(45px); }
  100% { transform: translateX(45px); }
}

/* status chips */
.fx-effects-chips {
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.fx-effects-chip {
  position: relative;
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 6px 10px 6px 11px;
  border: 1px solid #233150;
  border-radius: 7px;
  background: linear-gradient(90deg, rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0.16));
  font-size: 0.62rem;
  letter-spacing: 0.18em;
  color: #aab6d0;
  overflow: hidden;
}
.fx-effects-chip::before {
  /* faint left accent bar, like an indicator lamp housing */
  content: "";
  position: absolute;
  left: 0;
  top: 22%;
  bottom: 22%;
  width: 2px;
  border-radius: 1px;
  background: rgba(233, 185, 76, 0.45);
}
.fx-effects-chip-label { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* breathing dot */
.fx-effects-dot {
  flex: none;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #e9b94c;
  box-shadow: 0 0 0 2px rgba(233, 185, 76, 0.14), 0 0 8px rgba(233, 185, 76, 0.55);
  animation: fxeffects-breathe 4.2s ease-in-out infinite;
}
.fx-effects-dot-small { width: 5px; height: 5px; }
.fx-effects-chip-2 .fx-effects-dot { animation-delay: -1.4s; }
.fx-effects-chip-3 .fx-effects-dot { animation-delay: -2.8s; }
@keyframes fxeffects-breathe {
  0%, 100% { opacity: 0.5; }
  50% { opacity: 1; }
}

/* three equal activity squares that light in sequence — equal size so nothing reads as a level.
   The squares are static; one highlight slides across behind a square-shaped mask (one animator per
   chip instead of three), the chips offset from each other so the lights run around the rail. */
.fx-effects-ticks {
  position: relative;
  display: inline-flex;
  gap: 3px;
  flex: none;
  overflow: hidden;
  -webkit-mask-image: repeating-linear-gradient(90deg, #000 0 4px, transparent 4px 7px);
  mask-image: repeating-linear-gradient(90deg, #000 0 4px, transparent 4px 7px);
}
.fx-effects-ticks i {
  width: 4px;
  height: 4px;
  border-radius: 1px;
  background: #7fb3ff;
  opacity: 0.22;
}
.fx-effects-ticks::after {
  content: "";
  position: absolute;
  top: 0;
  bottom: 0;
  left: 0;
  width: 12px;
  background: linear-gradient(90deg, rgba(127, 179, 255, 0) 0%, rgba(127, 179, 255, 0.9) 50%, rgba(127, 179, 255, 0) 100%);
  transform: translateX(3px);
  animation: fxeffects-tick 2.6s ease-in-out infinite;
}
.fx-effects-chip-2 .fx-effects-ticks::after { animation-delay: 0.9s; }
.fx-effects-chip-3 .fx-effects-ticks::after { animation-delay: 1.8s; }
@keyframes fxeffects-tick {
  0% { transform: translateX(-12px); }
  45% { transform: translateX(18px); }
  100% { transform: translateX(18px); }
}

/* waveform box */
.fx-effects-wavebox {
  position: relative;
  height: 46px;
  border: 1px solid #233150;
  border-radius: 7px;
  background: rgba(0, 0, 0, 0.3);
  overflow: hidden;
}
.fx-effects-wavebox::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: radial-gradient(120% 90% at 50% 50%, transparent 55%, rgba(10, 16, 32, 0.55) 100%);
}
.fx-effects-wave {
  display: block;
  width: 100%;
  height: 100%;
}
.fx-effects-wave-a { animation: fxeffects-wave-scroll 9s linear infinite; }
.fx-effects-wave-b { animation: fxeffects-wave-scroll 14s linear infinite reverse; }
@keyframes fxeffects-wave-scroll {
  from { transform: translateX(0); }
  to { transform: translateX(-216px); }
}
/* reversed trace starts at -216 so it also stays inside the 2x-wide path */
.fx-effects-wave-b { transform: translateX(-216px); }
.fx-effects-wave-cursor { animation: fxeffects-wave-cursor 6s cubic-bezier(0.45, 0, 0.55, 1) infinite; }
@keyframes fxeffects-wave-cursor {
  0% { transform: translateX(0); opacity: 0; }
  6% { opacity: 1; }
  94% { opacity: 1; }
  100% { transform: translateX(216px); opacity: 0; }
}

/* =========================================================================================
   Incoming banner (above an incident card)
   ========================================================================================= */
.fx-effects-incoming {
  position: relative;
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 36px;
  min-width: 0;
  max-width: 100%;
  box-sizing: border-box;
  margin: 0 0 12px;
  padding: 7px 16px 7px 14px;
  border: 1px solid #2f4169;
  border-radius: 8px;
  background: linear-gradient(90deg, rgba(233, 185, 76, 0.08), rgba(0, 0, 0, 0.25) 40%, rgba(0, 0, 0, 0.25));
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  font-size: 0.7rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: #aab6d0;
  overflow: hidden;
  user-select: none;
  pointer-events: none;
  animation: fxeffects-incoming-settle 1.6s ease-out both;
}
@keyframes fxeffects-incoming-settle {
  0% { border-color: rgba(233, 185, 76, 0.9); box-shadow: 0 0 22px rgba(233, 185, 76, 0.28), inset 0 0 18px rgba(233, 185, 76, 0.1); }
  45% { border-color: rgba(233, 185, 76, 0.55); }
  100% { border-color: #2f4169; box-shadow: 0 0 0 rgba(233, 185, 76, 0), inset 0 0 0 rgba(233, 185, 76, 0); }
}
.fx-effects-incoming::before {
  /* scanline texture */
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: repeating-linear-gradient(180deg, rgba(255, 255, 255, 0.03) 0 1px, transparent 1px 3px);
}
.fx-effects-incoming-corner {
  position: absolute;
  top: 3px;
  bottom: 3px;
  width: 7px;
  border: 1px solid rgba(233, 185, 76, 0.7);
  animation: fxeffects-corner-in 600ms cubic-bezier(0.2, 0.7, 0.2, 1) both;
}
.fx-effects-incoming-corner-l { left: 3px; border-right: 0; border-radius: 4px 0 0 4px; }
.fx-effects-incoming-corner-r { right: 3px; border-left: 0; border-radius: 0 4px 4px 0; }
@keyframes fxeffects-corner-in {
  from { opacity: 0; transform: scaleY(0.4); }
  to { opacity: 1; transform: none; }
}

.fx-effects-incoming-chevrons { flex: none; display: block; margin-left: 8px; overflow: visible; }
.fx-effects-chev {
  animation: fxeffects-chev-in 520ms cubic-bezier(0.2, 0.7, 0.2, 1) both,
             fxeffects-chev-rest 4.5s ease-in-out 1.2s infinite;
}
.fx-effects-chev-2 { animation-delay: 110ms, 1.45s; }
.fx-effects-chev-3 { animation-delay: 220ms, 1.7s; }
@keyframes fxeffects-chev-in {
  from { opacity: 0; transform: translateX(-10px); }
  to { opacity: 1; transform: none; }
}
@keyframes fxeffects-chev-rest {
  0%, 100% { opacity: 0.45; }
  30% { opacity: 1; }
}

.fx-effects-incoming-text { flex: 0 1 auto; min-width: 0; display: inline-flex; flex-wrap: wrap; align-items: center; gap: 2px 10px; white-space: nowrap; }
.fx-effects-incoming-part {
  animation: fxeffects-part-in 500ms ease-out both;
}
.fx-effects-incoming-part-1 { color: #e9b94c; animation-delay: 160ms; }
.fx-effects-incoming-part-2 { color: #e8edf8; animation-delay: 300ms; }
.fx-effects-incoming-part-3 { color: #aab6d0; animation-delay: 440ms; }
.fx-effects-incoming-sep { color: #7b89a8; opacity: 0.8; animation: fxeffects-part-in 500ms ease-out 240ms both; }
@keyframes fxeffects-part-in {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: none; }
}

.fx-effects-incoming-rule {
  flex: 1 1 0;
  min-width: 0;
  height: 1px;
  background: repeating-linear-gradient(90deg, rgba(127, 179, 255, 0.45) 0 6px, transparent 6px 12px);
  opacity: 0.6;
  animation: fxeffects-part-in 600ms ease-out 500ms both;
}
.fx-effects-incoming-tail {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font-size: 0.6rem;
  color: #7b89a8;
  animation: fxeffects-part-in 500ms ease-out 620ms both;
}

/* one sweep of light left → right, then gone */
.fx-effects-incoming-sweep {
  position: absolute;
  top: -20%;
  bottom: -20%;
  left: 0;
  width: 34%;
  pointer-events: none;
  transform: translateX(-120%) skewX(-18deg);
  background: linear-gradient(90deg, rgba(243, 207, 122, 0) 0%, rgba(243, 207, 122, 0.16) 40%, rgba(243, 207, 122, 0.75) 52%, rgba(243, 207, 122, 0.16) 64%, rgba(243, 207, 122, 0) 100%);
  mix-blend-mode: screen;
  animation: fxeffects-sweep 1s cubic-bezier(0.4, 0, 0.3, 1) 380ms both;
}
@keyframes fxeffects-sweep {
  from { transform: translateX(-120%) skewX(-18deg); opacity: 1; }
  85% { opacity: 1; }
  to { transform: translateX(340%) skewX(-18deg); opacity: 0; }
}

@media (max-width: 560px) {
  .fx-effects-incoming { gap: 8px; padding: 6px 10px 6px 8px; font-size: 0.6rem; letter-spacing: 0.12em; }
  /* the text may wrap between its parts; the strip never grows wider than its container */
  .fx-effects-incoming-text { gap: 2px 7px; white-space: normal; }
  .fx-effects-incoming-part, .fx-effects-incoming-sep { white-space: nowrap; }
  .fx-effects-incoming-tail { display: none; }
  .fx-effects-incoming-chevrons { margin-left: 4px; }
}

/* Inline variant: a compact chip (about 28px tall) that sits in a flex row next to other chips,
   e.g. inside the incident card's header band. No margins, no stretching dashed tail; keeps the
   chevron slide-in, the part fade-in, the settle glow and the single light sweep. */
.fx-effects-incoming--inline {
  display: inline-flex;
  flex: 0 1 auto;
  align-self: center;
  gap: 8px;
  min-height: 0;
  height: 28px;
  margin: 0;
  padding: 0 12px 0 8px;
  border-radius: 6px;
  font-size: 0.62rem;
  letter-spacing: 0.16em;
  vertical-align: middle;
}
.fx-effects-incoming--inline .fx-effects-incoming-corner { top: 2px; bottom: 2px; width: 5px; }
.fx-effects-incoming--inline .fx-effects-incoming-chevrons { margin-left: 3px; width: 18px; height: 12px; }
.fx-effects-incoming--inline .fx-effects-incoming-text { gap: 0 7px; white-space: nowrap; flex-wrap: nowrap; }
